<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا | صبّار</title>
    <!-- Modern Arabic Font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="contact-us.css">
</head>
<body>

    <!-- Main Navigation Bar (نفس الهيدر المستخدم بالصفحة الرئيسية index.html حرفياً) -->
    <header class="main-navbar">
        <div class="navbar">
            <div class="nav-right">
                <a class="logo">
                    <span class="logo-circle"><img src="logo.png" width="25px" alt="أيقونة"></span>
                    <strong data-i18n="logo_text">بصمة الأعمال</strong>
                </a>
                <nav class="nav-links">
                    <a href="#" data-i18n="nav_companies"> الشركات</a>
                    <a href="#" data-i18n="nav_find_jobs">ابحث عن وظيفة</a>
                </nav>
            </div>
            <div class="nav-actions">
                <!-- زر تبديل اللغة -->
                <a href="#" id="langToggle" class="lang-switch">English</a>
                <a href="register-companies.html" class="btn btn-register" data-i18n="btn_register">تسجيل جديد</a>
                <a href="login-companies.html" class="btn btn-login" data-i18n="btn_login">تسجيل دخول الشركات</a>
            </div>
        </div>
    </header>

    <!-- Contact Form Section Viewport -->
    <main class="page-container">
        <div class="contact-card">

            <h1 class="form-title">حياك، تواصل معنا</h1>
            <p class="form-subtitle">علّمنا كيف نقدر نساعدك؟</p>

            <form class="contact-form">

                <!-- الاسم -->
                <div class="form-group">
                    <label for="fullName">الاسم</label>
                    <input type="text" id="fullName" placeholder="ادخل اسمك...">
                </div>

                <!-- رقم الجوال -->
                <div class="form-group">
                    <label for="phoneNumber">رقم الجوال</label>
                    <div class="phone-input-wrapper">
                        <input type="tel" id="phoneNumber" placeholder="5X XXX XXXX" style="direction: ltr; text-align: right;">
                        <div class="country-prefix">
                            <span>+966</span>
                            <span class="flag-icon">🇸🇦</span>
                        </div>
                    </div>
                </div>

                <!-- البريد الإلكتروني -->
                <div class="form-group">
                    <label for="emailAddress">البريد الإلكتروني</label>
                    <input type="email" id="emailAddress" placeholder="name@company.com" style="direction: ltr; text-align: right;">
                </div>

                <!-- نوع الاستفسار -->
                <div class="form-group">
                    <label for="queryType">نوع الاستفسار</label>
                    <div class="select-wrapper">
                        <select id="queryType">
                            <option value="" disabled selected>اختر...</option>
                            <option value="corporate">طلب توظيف شركات</option>
                            <option value="jobseeker">البحث عن وظيفة</option>
                            <option value="technical">دعم فني تقني</option>
                        </select>
                    </div>
                </div>

                <!-- نص الرسالة -->
                <div class="form-group">
                    <label for="messageText">نص الرسالة</label>
                    <textarea id="messageText" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
                </div>

                <!-- زر الإرسال -->
                <button type="submit" class="submit-btn">إرسال</button>

            </form>
        </div>
    </main>

    <!-- ربط نفس سكربت الترجمة/تبديل اللغة المستخدم بالصفحة الرئيسية حتى يعمل زر تبديل اللغة بالهيدر بنفس الطريقة -->
    <script src="homepage.js"></script>
</body>
</html>
