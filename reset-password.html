<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعيين كلمة مرور جديدة - بصمة الأعمال</title>
    <link rel="icon" type="image/png" href="resources/images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="resources/css/change-password.css">
</head>
<body>

    <div class="cp-screen">
        <div class="cp-card">
            <div class="cp-logo-section">
                <img src="resources/images/logo.png" alt="شعار شركة بصمة الأعمال" class="cp-logo">
                <h1 class="cp-title">🔒 تعيين كلمة مرور جديدة</h1>
                <p class="cp-subtitle" id="rpSubtitle">جاري التحقق من رابط إعادة التعيين...</p>
            </div>

            <div id="rpAlert" class="form-alert" style="display:none;"></div>

            <form id="resetPasswordForm" novalidate>
                <div class="form-group" id="group-new_password">
                    <label for="newPassword">كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" placeholder="8 أحرف على الأقل">
                    <span class="field-error" id="error-new_password"></span>
                </div>

                <div class="form-group" id="group-confirm_password">
                    <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
                    <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور">
                    <span class="field-error" id="error-confirm_password"></span>
                </div>

                <button type="submit" class="btn-cp-submit" id="rpSubmitBtn">
                    <span class="cp-spinner" id="rpSpinner" style="display:none;"></span>
                    <span id="rpBtnText">تحديث كلمة المرور</span>
                </button>
            </form>

            <a href="login.html" class="cp-logout-link" style="text-decoration:none; display:block;">→ العودة لتسجيل الدخول</a>
        </div>
    </div>

    <script src="config/supabase.js"></script>
    <script src="routes/routes.js"></script>
    <script src="app/scripts/auth/reset-password.js?v=2"></script>
</body>
</html>
