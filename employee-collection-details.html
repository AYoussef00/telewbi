<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الموظف ودفعات السداد - بصمة الأعمال</title>

    <!-- خط القاهرة الرسمي المعتمد في واجهات المنصة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- استدعاء حزمة سوبابيس الرسمية عبر خادم unpkg المباشر والمستقر -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="icons.js"></script>

    <link rel="stylesheet" href="global-layout.css?v=2">
    <link rel="stylesheet" href="sidebar.css?v=2">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="companies.css">
    <link rel="stylesheet" href="collections.css">
    <!-- تنسيقات خاصة بهذه الصفحة تحديداً: شريط المسار، بطاقة العرض، شبكة
         بيانات الموظف، شرائح الملخص، وجدول سجل الدفعات -->
    <link rel="stylesheet" href="employee-collection-details.css">
</head>
<body>

    <div class="app-container">

        <div id="sidebar-container"></div>

        <main class="main-content">

            <div id="navbar-container"></div>

            <div class="page-container">

                <div class="page-header">
                    <div class="header-title">
                        <nav class="breadcrumb-nav" aria-label="breadcrumb">
                            <span class="title-icon" data-icon="person"></span>
                            <a href="collections.html" class="breadcrumb-link">تحصيل الموظفين</a>
                            <span class="breadcrumb-separator" aria-hidden="true">/</span>
                            <span class="breadcrumb-current">تفاصيل الموظف ودفعات السداد</span>
                        </nav>
                        <p class="view-subtitle">بيانات الموظف الأساسية، وكامل سجل تحصيله الشهري عبر كل الأشهر المسجّلة (للعرض فقط)</p>
                    </div>
                </div>

                <div class="employee-collection-details-card">

                    <!-- شريط تنبيه لعرض رسائل الخطأ (مثل عدم وجود linkId بالرابط أو تعذّر العثور على الموظف) -->
                    <div id="employeeDetailsAlert" class="form-alert" style="display:none;"></div>

                    <div id="employeeDetailsPageContent" style="display:none;">

                        <div class="employee-details-info-grid" id="employeeDetailsInfoGrid"></div>

                        <div class="employee-details-summary-row" id="employeeDetailsSummaryRow"></div>

                        <h3 class="employee-details-section-title">
                            <span data-icon="clipboard"></span>
                            سجل دفعات السداد الشهرية
                        </h3>

                        <section class="table-container">
                            <table class="companies-table">
                                <thead>
                                    <tr>
                                        <th>الشهر</th>
                                        <th style="text-align: center;">المستحق</th>
                                        <th style="text-align: center;">المستلم</th>
                                        <th style="text-align: center;">المتبقي</th>
                                        <th style="text-align: center;">الحالة</th>
                                        <th style="text-align: center;">تاريخ التحصيل</th>
                                        <th>الملاحظات</th>
                                    </tr>
                                </thead>
                                <tbody id="employeeDetailsPaymentsBody">
                                    <tr><td colspan="7" style="text-align:center; padding:30px; color:#94a3b8;">جاري التحميل...</td></tr>
                                </tbody>
                            </table>
                        </section>

                    </div>

                    <div class="employee-details-page-actions">
                        <a href="collections.html" class="btn-details-back">&rarr; رجوع لتحصيل الموظفين</a>
                    </div>

                </div>

            </div>
        </main>

    </div>

    <script src="permissions.js?v=8"></script>
    <script src="app-core.js"></script>
    <script src="sidebar.js?v=3"></script>
    <script src="navbar.js"></script>
    <script src="employee-collection-details.js?v=4"></script>
</body>
</html>
