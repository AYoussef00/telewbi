<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الشركات</title>
    <link rel="stylesheet" href="register-companies.css">
    <!-- Google Fonts for premium Arabic typography -->
    <!-- Google Fonts for crisp Arabic typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    </head>
<body>

    <!-- Top Navigation Bar -->
    <header class="top-nav">
        <div class="nav-right">
            <span>باحث عن عمل؟</span>
            <a href="#" class="login-link">سجّل</a>
        </div>
        <div class="nav-left">
            <button class="btn-switch-lang">Switch to English</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="register-wrapper">
        <div class="register-card">
            
            <!-- Brand Logo & Header -->
            <div class="card-header">
                <div class="brand-logo">
                    <img src="logo.png" alt="شعار منصة الأعمال للشركات">
                </div>
                <h1 class="main-title">تسجيل الشركات</h1>
            </div>

            <!-- Registration Interactive Form -->
            <form id="companyRegisterForm">
                
                <!-- Full Width Field: Company Name -->
                <div class="form-group">
                    <label for="companyName">اسم العلامة التجارية أو الشركة</label>
                    <input type="text" id="companyName" placeholder="ادخل اسم العلامة التجارية أو الشركة" required>
                </div>

                <!-- Two Column Row: First & Last Name -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">الاسم الأول</label>
                        <input type="text" id="firstName" placeholder="ادخل الاسم الأول" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">اسم العائلة</label>
                        <input type="text" id="lastName" placeholder="ادخل اسم العائلة" required>
                    </div>
                </div>

                <!-- Full Width Field: Mobile Number -->
                <div class="form-group">
                    <label>رقم الجوال</label>
                    <div class="phone-input-group">
                        <div class="country-code">
                            <img src="saudi-flag.png" alt="SA" class="flag-icon">
                            <span class="code-text">+966</span>
                        </div>
                        <input type="tel" id="phoneNumber" placeholder="53 938 6950" required>
                    </div>
                </div>

                <!-- Full Width Field: Email -->
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="name@company.com" required style="direction: ltr; text-align: right;">
                </div>

                <!-- Employee Selection Radio Grid Grid -->
                <div class="form-group">
                    <label>عدد موظفي المنشأة حالياً</label>
                    <div class="radio-grid">
                        <label class="radio-card">
                            <input type="radio" name="employee_count" value="1-9" required>
                            <span class="radio-label-text">1-9</span>
                            <div class="custom-radio"></div>
                        </label>
                        <label class="radio-card">
                            <input type="radio" name="employee_count" value="11-49">
                            <span class="radio-label-text">11-49</span>
                            <div class="custom-radio"></div>
                        </label>
                        <label class="radio-card">
                            <input type="radio" name="employee_count" value="50-249">
                            <span class="radio-label-text">50-249</span>
                            <div class="custom-radio"></div>
                        </label>
                        <label class="radio-card">
                            <input type="radio" name="employee_count" value="250+">
                            <span class="radio-label-text">250+</span>
                            <div class="custom-radio"></div>
                        </label>
                    </div>
                </div>

                <!-- Full Width Field: Select Dropdown for Location -->
                <div class="form-group">
                    <label for="location">موقع إدارة الشركة</label>
                    <div class="select-wrapper">
                        <select id="location" required>
                            <option value="" disabled selected hidden>اختر من القائمة</option>
                            <option value="riyadh">الرياض</option>
                            <option value="jeddah">جدة</option>
                            <option value="dammam">الدمام</option>
                        </select>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">سجّل</button>
            </form>

            <!-- Terms & Aggreements Footer -->
            <p class="terms-text">
                من خلال التسجيل في المنصة فإنك تؤكد موافقتك على 
                <a href="#">الشروط والأحكام</a> & <a href="#">سياسة الخصوصية</a>
            </p>

        </div>
    </main>

    <!-- Support Floating Button -->
    <div class="support-widget">
        <button class="btn-support" aria-label="الدعم الفني">
            <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="support-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
            </svg>
        </button>
    </div>

</body>
</html>
