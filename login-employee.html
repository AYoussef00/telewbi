<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الموظفين - بصمة الأعمال</title>
    <!-- نفس ملف تنسيق شاشة دخول الشركات، لضمان تطابق الشكل تماماً -->
    <link rel="stylesheet" href="resources/css/login-companies.css">
    <!-- Google Fonts for crisp Arabic typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Top Navigation Bar: شعار الشركة (يعيد للصفحة الرئيسية) -->
    <header class="top-nav">
        <a href="index.html" class="logo">
            <span class="logo-circle"><img src="resources/images/logo.png" width="25" alt="أيقونة"></span>
            <strong id="brandNameText">بصمة الأعمال</strong>
        </a>
    </header>

    <!-- Main Content Area -->
    <main class="login-wrapper">
        <div class="login-card">

            <!-- Brand Logo & Header -->
            <div class="card-header">
                <div class="brand-logo">
                    <img src="resources/images/logo.png" alt="شعار بصمة الأعمال للموظفين">
                </div>
                <h1 class="main-title" id="mainTitleText">دخول الموظفين</h1>
                <p class="card-subtitle" id="cardSubtitleText">أدخل بيانات حسابك للوصول إلى النظام</p>
            </div>

            <!-- Login Interactive Form: بريد إلكتروني وكلمة مرور -->
            <form id="employeeLoginForm" novalidate>
                <div class="form-group">
                    <label for="employeeEmail" id="emailLabelText">البريد الإلكتروني</label>
                    <input type="email" id="employeeEmail" class="ltr-input" placeholder="name@company.com" required>
                </div>

                <div class="form-group password-container">
                    <label for="employeePassword" id="passwordLabelText">كلمة المرور</label>
                    <input type="password" id="employeePassword" placeholder="********" required>

                    <!-- زر التحكم الذكي بوضعية إظهار وإخفاء كلمة المرور -->
                    <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="إظهار كلمة المرور">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                    </button>
                </div>

                <!-- شريط تنبيه أعلى النموذج (رسائل النجاح/الخطأ) -->
                <div class="form-alert" id="loginFormAlert" style="display:none;"></div>

                <button type="submit" class="btn-submit" id="btnEmployeeSubmit">
                    <span class="btn-spinner" id="loginBtnSpinner" style="display:none;"></span>
                    <span id="loginBtnText">تسجيل دخول</span>
                </button>
            </form>

            <!-- Terms & Agreements Footer -->
            <p class="terms-text" id="termsText">
                من خلال تسجيل الدخول فإنك تؤكد موافقتك على
                <a href="#">الشروط والأحكام</a> و <a href="#">سياسة الخصوصية</a>
            </p>

            <div class="card-footer">
                <a href="login-companies.html" class="register-now-link" id="companyLoginLink">هل أنت صاحب شركة؟ تسجيل دخول الشركات</a>
            </div>

            <!-- 🆕 خيار "إنشاء حساب" — يُظهَر/يُخفى بالكامل حسب إعداد الإدارة
                 (app_settings.employee_self_registration_enabled)، مخفي
                 افتراضياً حتى يُتحقَّق من الإعداد فعلياً لتفادي ظهوره للحظة
                 ثم اختفائه (وميض غير مرغوب) عند إيقاف الميزة -->
            <div class="card-footer" id="createAccountContainer" style="display:none; margin-top:4px;">
                <a href="register-employee.html" class="register-now-link" id="createAccountLink">ليس لديك حساب؟ إنشاء حساب جديد</a>
            </div>

        </div>
    </main>

    <!-- Support Floating Button -->
    <div class="support-widget">
        <button class="btn-support" aria-label="الدعم الفني">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="support-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
            </svg>
        </button>
    </div>

    <script src="config/supabase.js"></script>
    <script src="routes/routes.js"></script>
    <script>
// login-employee.js (مضمّن مباشرة داخل الصفحة)
// تسجيل دخول الموظفين عبر البريد الإلكتروني وكلمة المرور (سوبابيس)
// اللغة تُقرأ من نفس تفضيل اللغة المحفوظ من الصفحة الرئيسية (لا يوجد زر تبديل لغة منفصل هنا)


// نصوص الترجمة الخاصة بهذه الصفحة (صفحة مستقلة لا تستخدم نظام ar.json/en.json الداخلي)
const translations = {
    ar: {
        pageTitle: "تسجيل دخول الموظفين - بصمة الأعمال",
        brandName: "بصمة الأعمال",
        mainTitle: "دخول الموظفين",
        cardSubtitle: "أدخل بيانات حسابك للوصول إلى النظام",
        emailLabel: "البريد الإلكتروني",
        emailPlaceholder: "name@company.com",
        passwordLabel: "كلمة المرور",
        passwordPlaceholder: "********",
        loginBtn: "تسجيل دخول",
        loggingIn: "جاري تسجيل الدخول...",
        termsPrefix: "من خلال تسجيل الدخول فإنك تؤكد موافقتك على",
        termsAnd: "و",
        termsLink: "الشروط والأحكام",
        privacyLink: "سياسة الخصوصية",
        companyLoginLink: "هل أنت صاحب شركة؟ تسجيل دخول الشركات",
        createAccountLink: "ليس لديك حساب؟ إنشاء حساب جديد",
        fillFields: "يرجى إدخال البريد الإلكتروني وكلمة المرور.",
        loginSuccess: "تم تسجيل الدخول بنجاح! جاري التحويل...",
        connectionError: "تعذّر الاتصال بالخادم. يرجى التحقق من اتصال الإنترنت والمحاولة مرة أخرى.",
        notEmployeeAccount: "هذا الحساب ليس حساب موظف، ولا يمكن الدخول به من هنا. إن كنت صاحب شركة فيرجى استخدام شاشة دخول الشركات.",
        invalidCredentials: "البريد الإلكتروني أو كلمة المرور غير صحيحة. يرجى التأكد من البيانات والمحاولة مرة أخرى.",
        tooManyRequests: "محاولات تسجيل دخول كثيرة خلال وقت قصير. يرجى الانتظار قليلاً ثم المحاولة مرة أخرى.",
        emailNotConfirmed: "لم يتم تأكيد البريد الإلكتروني بعد. يرجى مراجعة بريدك الإلكتروني لإكمال التفعيل.",
        accountPendingReview: "حسابك قيد المراجعة من قبل الإدارة حالياً. سيتم إشعارك بمجرد تفعيله، وعندها فقط يمكنك تسجيل الدخول.",
        accountRejected: "تم رفض طلب إنشاء حسابك من قبل الإدارة. للاستفسار، يرجى التواصل مع إدارة النظام."
    },
    en: {
        pageTitle: "Employee Login - Business Imprint",
        brandName: "Business Imprint",
        mainTitle: "Employee Login",
        cardSubtitle: "Enter your account details to access the system",
        emailLabel: "Email Address",
        emailPlaceholder: "name@company.com",
        passwordLabel: "Password",
        passwordPlaceholder: "********",
        loginBtn: "Log In",
        loggingIn: "Logging in...",
        termsPrefix: "By logging in, you agree to the",
        termsAnd: "and",
        termsLink: "Terms & Conditions",
        privacyLink: "Privacy Policy",
        companyLoginLink: "Are you a company owner? Company Login",
        createAccountLink: "Don't have an account? Create one",
        fillFields: "Please enter your email and password.",
        loginSuccess: "Logged in successfully! Redirecting...",
        connectionError: "Could not connect to the server. Please check your internet connection and try again.",
        notEmployeeAccount: "This account is not an employee account and cannot log in here. If you're a company owner, please use the company login screen.",
        invalidCredentials: "The email or password is incorrect. Please check your details and try again.",
        tooManyRequests: "Too many login attempts in a short time. Please wait a moment and try again.",
        emailNotConfirmed: "This email address has not been confirmed yet. Please check your inbox to complete activation.",
        accountPendingReview: "Your account is currently under review by the administration. You will be notified once it is activated, and only then can you log in.",
        accountRejected: "Your account creation request was rejected by the administration. Please contact the system administrator for details."
    }
};

let currentLang = "ar";

// =========================================================================
// 🧭 ترجمة رسائل الأخطاء الخام القادمة من سوبابيس (Supabase) إلى رسائل
// عربية/إنجليزية واضحة وودّية بدل عرض النص التقني الخام (مثل
// "Failed to fetch" أو "Invalid login credentials") مباشرةً للمستخدم النهائي.
// =========================================================================
function getFriendlyLoginErrorMessage(rawMessage) {
    const t = translations[currentLang] || translations.ar;
    const msg = (rawMessage || '').toLowerCase();

    if (msg.includes('fetch') || msg.includes('network') || msg.includes('load failed') || msg.includes('err_')) {
        return t.connectionError;
    }
    if (msg.includes('invalid login credentials') || msg.includes('invalid email or password')) {
        return t.invalidCredentials;
    }
    if (msg.includes('rate limit') || msg.includes('too many requests')) {
        return t.tooManyRequests;
    }
    if (msg.includes('email not confirmed')) {
        return t.emailNotConfirmed;
    }
    return rawMessage;
}

function setText(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
}

function applyLanguage(lang) {
    const t = translations[lang] || translations.ar;
    currentLang = lang;

    document.documentElement.lang = lang === "ar" ? "ar" : "en";
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t.pageTitle;

    setText("brandNameText", t.brandName);
    setText("mainTitleText", t.mainTitle);
    setText("cardSubtitleText", t.cardSubtitle);
    setText("emailLabelText", t.emailLabel);
    setText("passwordLabelText", t.passwordLabel);
    setText("loginBtnText", t.loginBtn);
    setText("companyLoginLink", t.companyLoginLink);
    setText("createAccountLink", t.createAccountLink);

    const emailInput = document.getElementById("employeeEmail");
    if (emailInput) emailInput.placeholder = t.emailPlaceholder;

    const passwordInput = document.getElementById("employeePassword");
    if (passwordInput) passwordInput.placeholder = t.passwordPlaceholder;

    const termsText = document.getElementById("termsText");
    if (termsText) {
        termsText.innerHTML = `${t.termsPrefix} <a href="#">${t.termsLink}</a> ${t.termsAnd} <a href="#">${t.privacyLink}</a>`;
    }
}

function togglePasswordView() {
    const passwordInput = document.getElementById("employeePassword");
    const eyeIcon = document.getElementById("eyeIcon");
    if (!passwordInput) return;

    const isHidden = passwordInput.type === "password";
    passwordInput.type = isHidden ? "text" : "password";

    if (eyeIcon) {
        if (isHidden) {
            // كلمة المرور ظاهرة الآن -> أيقونة "عين مغلقة"
            eyeIcon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            `;
        } else {
            eyeIcon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            `;
        }
    }
}

function showLoginAlert(message, type) {
    const alertBox = document.getElementById("loginFormAlert");
    if (!alertBox) return;
    alertBox.textContent = message;
    alertBox.className = "form-alert " + (type === "success" ? "alert-success" : "alert-error");
    alertBox.style.display = "block";
}

function hideLoginAlert() {
    const alertBox = document.getElementById("loginFormAlert");
    if (!alertBox) return;
    alertBox.style.display = "none";
    alertBox.textContent = "";
}

// 🆕 يتحقق من إعداد الإدارة (app_settings.employee_self_registration_enabled)
// ويُظهر رابط "إنشاء حساب جديد" فقط إن كان مُفعّلاً — مخفي افتراضياً بالـ HTML
// حتى اكتمال هذا التحقق، لتفادي ظهوره للحظة ثم اختفائه عند إيقاف الميزة.
async function applyCreateAccountVisibility() {
    const container = document.getElementById('createAccountContainer');
    if (!container) return;
    try {
        const { data, error } = await dbClient
            .from('app_settings')
            .select('value')
            .eq('key', 'employee_self_registration_enabled')
            .maybeSingle();

        if (error) throw new Error(error.message);

        // لا يوجد صف محفوظ بعد (قبل تنفيذ سكربت الإعداد) ⇐ نُبقي الخيار
        // مخفياً بأمان بدل افتراض تفعيله
        const isEnabled = data ? (data.value === true || data.value === 'true') : false;
        container.style.display = isEnabled ? 'block' : 'none';
    } catch (error) {
        console.error('تعذّر التحقق من إتاحة ميزة إنشاء حساب الموظف:', error.message);
        container.style.display = 'none';
    }
}

document.addEventListener("DOMContentLoaded", () => {
    // اللغة تُقرأ من نفس تفضيل اللغة الذي يحفظه المستخدم من الصفحة الرئيسية (افتراضياً عربي)
    let savedLang = "ar";
    try {
        savedLang = localStorage.getItem("preferredLanguage") || "ar";
    } catch (e) {
        savedLang = "ar";
    }
    applyLanguage(savedLang);
    applyCreateAccountVisibility();

    const togglePasswordBtn = document.getElementById("togglePasswordBtn");
    if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener("click", togglePasswordView);
    }

    const form = document.getElementById("employeeLoginForm");
    const submitBtn = document.getElementById("btnEmployeeSubmit");
    const btnText = document.getElementById("loginBtnText");
    const btnSpinner = document.getElementById("loginBtnSpinner");

    if (form) {
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideLoginAlert();

            const t = translations[currentLang] || translations.ar;
            const email = (document.getElementById("employeeEmail").value || "").trim();
            const password = document.getElementById("employeePassword").value || "";

            if (!email || !password) {
                showLoginAlert(t.fillFields, "error");
                return;
            }

            // تعطيل الزر وإظهار مؤشر التحميل أثناء تسجيل الدخول
            submitBtn.disabled = true;
            if (btnSpinner) btnSpinner.style.display = "inline-block";
            if (btnText) btnText.textContent = t.loggingIn;

            try {
                const { data, error } = await dbClient.auth.signInWithPassword({ email, password });

                if (error) {
                    showLoginAlert(getFriendlyLoginErrorMessage(error.message), "error");
                    return;
                }

                // التحقق من نوع الحساب (يجب أن يكون حساب موظف) ومن حالة كلمة المرور وحالة المراجعة معاً
                let userRole = null;
                let mustChangePassword = false;
                let accountStatus = null;
                try {
                    const { data: userRow } = await dbClient
                        .from('users')
                        .select('role, must_change_password, status')
                        .eq('id', data.user.id)
                        .maybeSingle();
                    userRole = userRow ? userRow.role : null;
                    mustChangePassword = !!(userRow && userRow.must_change_password);
                    accountStatus = userRow ? userRow.status : null;
                } catch (innerErr) {
                    console.error('تعذّر التحقق من بيانات الحساب:', innerErr);
                }

                // هذه الشاشة مخصصة لحسابات الموظفين فقط — أي دور آخر (شركة، مسؤول، ...) يُرفض ويُسجَّل خروجه فوراً
                if (userRole !== 'employee') {
                    await dbClient.auth.signOut();
                    showLoginAlert(t.notEmployeeAccount, "error");
                    return;
                }

                // 🆕 حساب موظف أنشأه بنفسه عبر "إنشاء حساب" ولم توافق عليه
                // الإدارة بعد (أو رفضته) — يُمنع الدخول ويُسجَّل خروجه فوراً
                if (accountStatus === 'pending_review') {
                    await dbClient.auth.signOut();
                    showLoginAlert(t.accountPendingReview, "error");
                    return;
                }
                if (accountStatus === 'rejected') {
                    await dbClient.auth.signOut();
                    showLoginAlert(t.accountRejected, "error");
                    return;
                }

                // تسجيل عملية الدخول هذه بجدول login_logs (سجل عمليات الدخول)
                try {
                    await dbClient.from('login_logs').insert([{ user_id: data.user.id }]);
                } catch (logErr) {
                    console.error('تعذّر تسجيل عملية الدخول بسجل login_logs:', logErr);
                }

                showLoginAlert(t.loginSuccess, "success");

                setTimeout(() => {
                    window.location.replace(mustChangePassword ? Routes.url('change-password') : Routes.url('dashboard'));
                }, 300);

            } catch (catchErr) {
                // خطأ في الاتصال (شبكة/انقطاع) - يجب إظهاره للمستخدم دائماً حتى لا يظن أنه بحاجة لمحاولات متكررة
                console.error('خطأ اتصال أثناء تسجيل الدخول:', catchErr);
                showLoginAlert(t.connectionError, "error");
            } finally {
                submitBtn.disabled = false;
                if (btnSpinner) btnSpinner.style.display = "none";
                if (btnText) btnText.textContent = t.loginBtn;
            }
        });
    }
});
    </script>
</body>
</html>
