<!-- الشريط العلوي المستقر مع الملف الشخصي وزر تبديل اللغة التفاعلي -->
<header class="top-navbar">
    <div class="nav-right">
        <div class="welcome-block">
            <span class="welcome-avatar" id="welcomeAvatar">S</span>
            <div class="welcome-text">
                <span class="welcome-msg">
                    <span data-i18n="welcomeMsg">أهلاً بك، </span><span id="adminName" class="admin-name"></span>
                </span>
                <span class="welcome-role" id="adminRoleLabel"></span>
            </div>
        </div>
    </div>
    <div class="nav-left">
        <!-- 🌐 زر تبديل اللغة المخصص لتشغيل محرك الـ JSON -->
        <button type="button" class="nav-icon-btn" id="languageSwitcher" onclick="switchLanguage()" title="Switch language / تبديل اللغة">
            <span class="nav-icon" data-icon="globe"></span>
        </button>

        <button type="button" class="nav-icon-btn" title="الإشعارات" onclick="Routes.go('notifications')">
            <span class="nav-icon" data-icon="bell"></span>
            <span class="notif-dot"></span>
        </button>

        <div class="profile-dropdown-container">
            <button type="button" class="profile-trigger" onclick="toggleProfileDropdown(event)">
                <span class="user-badge" id="userBadge">S</span>
                <span class="profile-chevron" data-icon="chevron-down"></span>
            </button>

            <!-- القائمة المنسدلة للحساب الشخصي المتطابقة تماماً -->
            <div class="dropdown-menu" id="profileDropdown">
                <div class="dropdown-header">
                    <span class="dropdown-avatar" id="dropdownAvatar">S</span>
                    <div class="dropdown-header-text">
                        <strong id="dropdownUserName"></strong>
                        <span id="dropdownUserEmail">—</span>
                    </div>
                </div>
                <ul class="dropdown-list">
                    <li><a href="profile.html"><span class="drop-icon" data-icon="person"></span> <span data-i18n="profile">الملف الشخصي</span></a></li>
                    <li><a href="notifications.html"><span class="drop-icon" data-icon="bell"></span> <span data-i18n="notifications">تفضيلات الإشعارات</span></a></li>
                    <li><a href="settings.html"><span class="drop-icon" data-icon="gear"></span> <span data-i18n="menuSettings">الإعدادات</span></a></li>
                    <li class="divider"></li>
                    <li><a href="#" class="logout-link" onclick="handleLogout()"><span class="drop-icon" data-icon="logout"></span> <span data-i18n="logout">تسجيل الخروج</span></a></li>
                </ul>
            </div>
        </div>
    </div>
</header>
