<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات الموظف - بصمة الأعمال</title>
    <!-- استدعاء خط Cairo للأنظمة العربية -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- استدعاء حزمة سوبابيس الرسمية عبر خادم unpkg المباشر والمستقر -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../routes/routes.js"></script>
    <script src="../shared/icons.js"></script>

    <!-- ملفات التنسيق الموديلار المفصولة والمنظمة -->
    <link rel="stylesheet" href="../../resources/css/global-layout.css?v=2">
    <link rel="stylesheet" href="../../resources/css/sidebar.css?v=2">
    <link rel="stylesheet" href="../../resources/css/navbar.css">
    <!-- إعادة استخدام نفس تنسيقات شاشة "إضافة موظف" حتى تظهر شاشة العرض بنفس الطراز تماماً -->
    <link rel="stylesheet" href="../../resources/css/add_employee.css">
    <!-- تنسيقات إضافية خاصة بحالة العرض فقط (القراءة/المستندات) -->
    <link rel="stylesheet" href="../../resources/css/view_employee.css">
</head>
<body>
    <div class="app-container">

        <!-- اللوحة الجانبية للنظام -->
        <div id="sidebar-container"></div>

        <!-- منطقة المحتوى وشريط التنقل العلوي -->
        <main class="main-content">

            <div id="navbar-container"></div>

            <div class="page-container">
                <div class="add-employee-container">

                    <div class="page-header">
                        <div class="header-title">
                            <nav class="breadcrumb-nav" aria-label="breadcrumb">
                                <span class="title-icon">👁️</span>
                                <a href="employees.html" class="breadcrumb-link" data-i18n="menuEmployees">الموظفين</a>
                                <span class="breadcrumb-separator" aria-hidden="true">/</span>
                                <span class="breadcrumb-current">بيانات الموظف</span>
                            </nav>
                            <p class="view-subtitle">عرض بيانات الموظف ومستنداته الرسمية (للعرض فقط)</p>
                        </div>
                    </div>

                    <!-- بطاقة عرض بيانات الموظف — للقراءة فقط -->
                    <div class="form-card">

                        <!-- شريط تنبيه عام لعرض رسائل الخطأ (مثل عدم العثور على الموظف) -->
                        <div id="viewAlert" class="form-alert" style="display:none;"></div>

                        <div id="viewEmployeeContent" style="display:none;">

                            <h3 class="form-section-title">📋 البيانات الأساسية</h3>
                            <div class="form-grid">

                                <div class="form-group full-width" id="group-view-name">
                                    <label>الاسم الكامل</label>
                                    <input type="text" id="viewEmpName" disabled>
                                </div>

                                <div class="form-group" id="group-view-national_id">
                                    <label>رقم الهوية / الإقامة</label>
                                    <input type="text" id="viewEmpNationalId" disabled>
                                </div>

                                <div class="form-group" id="group-view-mobile_number">
                                    <label>رقم الجوال</label>
                                    <input type="text" id="viewEmpMobile" disabled>
                                </div>

                                <div class="form-group" id="group-view-birth_date">
                                    <label>تاريخ الميلاد</label>
                                    <input type="text" id="viewEmpBirthDate" disabled>
                                </div>

                                <div class="form-group" id="group-view-email">
                                    <label>البريد الإلكتروني</label>
                                    <input type="text" id="viewEmpEmail" disabled>
                                </div>

                                <div class="form-group" id="group-view-job_title">
                                    <label>المسمى الوظيفي</label>
                                    <input type="text" id="viewEmpJobTitle" disabled>
                                </div>

                                <div class="form-group" id="group-view-company">
                                    <label>اسم الشركة</label>
                                    <input type="text" id="viewEmpCompany" disabled>
                                </div>

                                <div class="form-group" id="group-view-iban">
                                    <label>رقم الآيبان (IBAN)</label>
                                    <input type="text" id="viewEmpIban" disabled>
                                </div>

                                <div class="form-group" id="group-view-status">
                                    <label>الحالة</label>
                                    <input type="text" id="viewEmpStatus" disabled>
                                </div>

                                <div class="form-group" id="group-view-role">
                                    <label>الدور / الصلاحية</label>
                                    <input type="text" id="viewEmpRole" disabled>
                                </div>

                            </div>

                            <h3 class="form-section-title">📎 المستندات الرسمية</h3>
                            <div class="form-grid view-docs-grid" id="viewEmpDocsGrid">
                                <!-- تُبنى روابط/حالة المستندات ديناميكياً عبر view_employee.js -->
                            </div>
                        </div>

                        <!-- أزرار الإجراءات -->
                        <div class="form-actions">
                            <button type="button" id="btnBackToEmployees" class="btn btn-cancel">→ رجوع لقائمة الموظفين</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- استدعاء ملفات تشغيل المنطق البرمجي والمحاكاة بالتوالي -->
    <script src="../../bootstrap/permissions.js?v=8"></script>
    <script src="../../bootstrap/app-core.js"></script>
    <script src="../shared/sidebar.js?v=3"></script>
    <script src="../shared/navbar.js"></script>
    <!-- ربط ملف العمليات الخارجي الخاص بشاشة عرض الموظف -->
    <script src="../scripts/view_employee.js?v=2"></script>

</body>
</html>
