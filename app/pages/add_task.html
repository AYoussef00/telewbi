<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مهمة جديدة - بصمة الأعمال</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../routes/routes.js"></script>
    <script src="../shared/icons.js"></script>

    <link rel="stylesheet" href="../../resources/css/global-layout.css?v=2">
    <link rel="stylesheet" href="../../resources/css/sidebar.css?v=2">
    <link rel="stylesheet" href="../../resources/css/navbar.css">
    <link rel="stylesheet" href="../../resources/css/add_employee.css">
    <link rel="stylesheet" href="../../resources/css/tasks_bulk.css">
</head>
<body>

    <!-- 🔄 شاشة التحميل بشعار الشركة — تُخفى تلقائياً بعد اكتمال تحميل السايدبار وشريط التنقل (app-core.js) -->
    <div id="pageLoader" class="page-loader">
        <div class="loader-ring"></div>
        <img src="../../resources/images/logo.png" alt="شعار شركة بصمة الأعمال" class="loader-logo">
    </div>

    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="page-container">
                <div class="add-employee-container">

                    <div class="page-header">
                        <div class="header-title">
                            <nav class="breadcrumb-nav" aria-label="breadcrumb">
                                <span class="title-icon">✅</span>
                                <a href="tasks.html" class="breadcrumb-link">إدارة المهام</a>
                                <span class="breadcrumb-separator" aria-hidden="true">/</span>
                                <span class="breadcrumb-current">إضافة مهمة جديدة</span>
                            </nav>
                            <p class="view-subtitle">أضف مهمة جديدة وأسندها لأحد الموظفين (اختياري)</p>
                        </div>
                    </div>

                    <form id="addTaskForm" class="form-card" novalidate>
                        <div id="formAlert" class="form-alert" style="display:none;"></div>

                        <!-- الشركة -->
                        <div class="form-grid">
                            <div class="form-group full-width" id="group-company_id">
                                <label for="taskCompanySearch">🏢 الشركة</label>
                                <div class="combo-box" id="comboTaskCompany">
                                    <input type="text" id="taskCompanySearch" class="combo-input" placeholder="ابحث عن شركة..." autocomplete="off">
                                    <input type="hidden" id="taskCompanyId">
                                    <span class="combo-arrow">▾</span>
                                    <div class="combo-dropdown" id="taskCompanyDropdown"></div>
                                </div>
                                <span class="field-error" id="error-company_id"></span>
                            </div>
                        </div>

                        <!-- عنوان المهمة -->
                        <div class="form-grid">
                            <div class="form-group full-width" id="group-title">
                                <label for="taskTitle">📝 عنوان المهمة</label>
                                <input type="text" id="taskTitle" placeholder="مثال: مراجعة تقرير المبيعات اليومي">
                                <span class="field-error" id="error-title"></span>
                            </div>
                        </div>

                        <!-- ملاحظات (مباشرة تحت العنوان) -->
                        <div class="form-grid">
                            <div class="form-group full-width" id="group-notes">
                                <label for="taskNotes">🗒️ ملاحظات <span class="optional-tag">(اختياري)</span></label>
                                <textarea id="taskNotes" class="bulk-task-notes" placeholder="تفاصيل إضافية عن المهمة..."></textarea>
                            </div>
                        </div>

                        <!-- النوع + الحالة -->
                        <div class="form-grid">
                            <div class="form-group" id="group-type">
                                <label for="taskType">النوع</label>
                                <select id="taskType">
                                    <option value="مسندة" selected>مسندة</option>
                                    <option value="مستقلة">مستقلة</option>
                                    <option value="روتينية">روتينية</option>
                                </select>
                            </div>
                            <div class="form-group" id="group-status">
                                <label for="taskStatus">الحالة</label>
                                <select id="taskStatus">
                                    <option value="قيد الانتظار" selected>قيد الانتظار</option>
                                    <option value="قيد التنفيذ">قيد التنفيذ</option>
                                    <option value="مكتملة">مكتملة</option>
                                </select>
                            </div>
                        </div>

                        <!-- إسناد إلى -->
                        <div class="form-grid">
                            <div class="form-group full-width" id="group-assigned_to">
                                <label for="taskAssigneeSearch">👤 إسناد إلى <span class="optional-tag">(اختياري)</span></label>
                                <div class="combo-box" id="comboTaskAssignee">
                                    <input type="text" id="taskAssigneeSearch" class="combo-input" placeholder="اختر الشركة أولاً..." autocomplete="off" disabled>
                                    <input type="hidden" id="taskAssignedTo">
                                    <span class="combo-arrow">▾</span>
                                    <div class="combo-dropdown" id="taskAssigneeDropdown"></div>
                                </div>
                            </div>
                        </div>

                        <!-- فترة المهمة: من تاريخ / إلى تاريخ — تُستخدم لمنع تعارضها مع فترة مهمة أخرى مُسندة لنفس الموظف -->
                        <h3 class="form-section-title range-section-title" id="rangeSectionTitle">📅 فترة المهمة</h3>
                        <div class="form-grid">
                            <div class="form-group" id="group-start_date">
                                <label for="taskStartDate">من تاريخ <span class="optional-tag" id="startDateOptionalTag">(اختياري)</span></label>
                                <input type="date" id="taskStartDate">
                                <span class="field-error" id="error-start_date"></span>
                            </div>
                            <div class="form-group" id="group-due_date">
                                <label for="taskDueDate">إلى تاريخ <span class="optional-tag">(اختياري)</span></label>
                                <input type="date" id="taskDueDate">
                                <span class="field-error" id="error-due_date"></span>
                            </div>
                        </div>
                        <span class="field-hint" id="periodHint">📌 عند إسناد المهمة لموظف يلزم تحديد "من تاريخ" على الأقل — ولا يمكن إسناد مهمة أخرى له بفترة تتقاطع مع هذه الفترة؛ يمكن إسناد مهمة جديدة له بتاريخ بعد انتهاء هذه الفترة مباشرة.</span>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-submit" data-perm="add:tasks">حفظ المهمة</button>
                            <button type="button" id="btnCancel" class="btn btn-cancel">إلغاء</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../../bootstrap/permissions.js?v=8"></script>
    <script src="../../bootstrap/app-core.js"></script>
    <script src="../shared/sidebar.js?v=3"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../scripts/add_task.js?v=2"></script>
</body>
</html>
