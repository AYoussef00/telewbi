<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="menuCompanyLinksReport">تقرير ربط الشركات</title>

    <!-- خط القاهرة الرسمي المعتمد في واجهات المنصة -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- استدعاء حزمة سوبابيس الرسمية عبر خادم unpkg المباشر والمستقر -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../routes/routes.js"></script>
    <script src="../shared/icons.js"></script>
    <!-- مكتبة SheetJS لتصدير التقرير كملف Excel (.xlsx) مباشرة من المتصفح -->
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- مكتبة توليد رمز QR (يُضمَّن بترويسة صفحة الطباعة، ويشير لصفحة عرض عامة للتقرير) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <!-- وحدة بناء صفحات الطباعة الاحترافية المشتركة (ترويسة/جدول/علامة مائية/تذييل) -->
    <script src="../scripts/print-report.js?v=4"></script>

    <!-- ملفات التنسيق الموديلار المفصولة والمنظمة (نفس أساس تقرير الشركات لتطابق بصري بين صفحات التقارير) -->
    <link rel="stylesheet" href="../../resources/css/global-layout.css?v=2">
    <link rel="stylesheet" href="../../resources/css/sidebar.css?v=2">
    <link rel="stylesheet" href="../../resources/css/navbar.css">
    <link rel="stylesheet" href="../../resources/css/employees.css">
    <link rel="stylesheet" href="../../resources/css/companies-report.css">
    <link rel="stylesheet" href="../../resources/css/print-report.css">
</head>
<body>

    <div class="app-container">
        <!-- 1. القائمة الجانبية المظلمة الاحترافية (Sidebar) -->
        <div id="sidebar-container"></div>

        <!-- مساحة العمل الرئيسية -->
        <main class="main-content">
            <!-- الشريط العلوي المستقر مع حسابات المستخدم واللغات -->
            <div id="navbar-container"></div>

            <div class="dashboard-container">

                <!-- حاوية صفحات الطباعة الاحترافية: مخفية تماماً على الشاشة،
                     تُبنى ديناميكياً وتظهر فقط عند استدعاء "طباعة" (انظر print-report.js/.css) -->
                <div id="printPagesRoot" class="print-report-container"></div>

                <div class="page-header">
                    <div class="header-title">
                        <h1 class="view-main-title">
                            <span class="title-icon" data-icon="link"></span>
                            <span data-i18n="menuCompanyLinksReport">تقرير ربط الشركات</span>
                        </h1>
                        <p class="view-subtitle">بحث شامل في بيانات ربط الموظفين بالشركات وحالة كل ربط، وتصدير التقرير</p>
                    </div>

                    <div class="header-actions report-actions-bar">
                        <button type="button" class="btn-export-excel" id="btnExportExcel"><span data-icon="download"></span> تصدير Excel</button>
                        <button type="button" class="btn-print-report" id="btnPrintReport"><span data-icon="printer"></span> طباعة</button>
                    </div>
                </div>

                <!-- شريط البحث والتصفية: قوائم بحث قابلة للكتابة فيها (Searchable Combobox) للموظف والشركة + فلتر الحالة -->
                <section class="companies-filter-bar report-filter-bar">
                    <div class="search-combo-wrapper" id="comboEmployeeSearch">
                        <span class="search-icon" data-icon="search"></span>
                        <input type="text" id="reportEmployeeSearchInput" class="search-combo-input" placeholder="ابحث باسم الموظف..." autocomplete="off">
                        <div class="combo-dropdown" id="reportEmployeeDropdown"></div>
                    </div>
                    <div class="search-combo-wrapper" id="comboCompanySearch">
                        <span class="search-icon" data-icon="search"></span>
                        <input type="text" id="reportCompanySearchInput" class="search-combo-input" placeholder="ابحث باسم الشركة..." autocomplete="off">
                        <div class="combo-dropdown" id="reportCompanyDropdown"></div>
                    </div>
                    <div class="filter-dropdown-wrapper">
                        <select id="reportLinkTypeFilter">
                            <option value="all">نوع الربط (الكل)</option>
                            <option value="اضافة">اضافة</option>
                            <option value="استضافة">استضافة</option>
                        </select>
                    </div>
                    <div class="filter-dropdown-wrapper">
                        <select id="reportStatusFilter">
                            <option value="all">حالة الربط (الكل)</option>
                            <option value="assigned">تم التعيين</option>
                            <option value="pending">قيد المعالجة</option>
                        </select>
                    </div>
                </section>

                <p class="report-results-count" id="reportResultsCount"></p>

                <!-- جدول تقرير ربط الشركات -->
                <section class="table-container">
                    <table class="companies-table">
                        <thead>
                            <tr>
                                <th style="width: 24%;">اسم الموظف</th>
                                <th style="width: 13%;">رقم الهوية</th>
                                <th style="width: 13%;">رقم الجوال</th>
                                <th style="width: 12%; text-align: center;">الراتب</th>
                                <th style="width: 13%; text-align: center;">رسوم الموظف (الصافي)</th>
                                <th style="width: 12%; text-align: center;">رسوم الاسترداد</th>
                                <th style="width: 13%; text-align: center;">الحالة</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody">
                            <tr>
                                <td colspan="7" class="table-loading-state">
                                    جاري جلب بيانات التقرير...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <!-- 📄 أزرار التنقل بين صفحات التقرير -->
                <div id="reportPagination" class="pagination-container"></div>
            </div>
        </main>
    </div>

    <!-- استدعاء ملفات تشغيل المنطق البرمجي والمحاكاة بالتوالي -->
    <script src="../../bootstrap/permissions.js?v=8"></script>
    <script src="../../bootstrap/app-core.js"></script>
    <script src="../shared/sidebar.js?v=3"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../scripts/companies-links-report.js?v=3"></script>
</body>
</html>
