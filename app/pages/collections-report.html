<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="menuCollectionsReport">تقرير تحصيل الموظفين</title>

    <!-- خط القاهرة الرسمي المعتمد في واجهات المنصة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- استدعاء حزمة سوبابيس الرسمية عبر خادم unpkg المباشر والمستقر -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../routes/routes.js"></script>
    <script src="../shared/icons.js"></script>
    <!-- مكتبة SheetJS لتصدير التقرير كملف Excel (.xlsx) مباشرة من المتصفح -->
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- مكتبة توليد رمز QR (يُضمَّن بترويسة صفحة الطباعة، ويشير لصفحة عرض عامة للتقرير) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <!-- وحدة بناء صفحات الطباعة الاحترافية المشتركة (ترويسة/جدول/علامة مائية/تذييل) -->
    <script src="../scripts/print-report.js?v=4"></script>

    <!-- ملفات التنسيق: نعيد استخدام تنسيقات الجدول/شريط البحث من employee-report.css
         وبطاقات الإحصائيات/خلايا الأرقام من collections.css، مع إضافات خاصة بهذا
         التقرير فقط بملف collections-report.css -->
    <link rel="stylesheet" href="../../resources/css/global-layout.css?v=2">
    <link rel="stylesheet" href="../../resources/css/sidebar.css?v=2">
    <link rel="stylesheet" href="../../resources/css/navbar.css">
    <link rel="stylesheet" href="../../resources/css/companies.css">
    <link rel="stylesheet" href="../../resources/css/employees.css">
    <link rel="stylesheet" href="../../resources/css/employee-report.css">
    <link rel="stylesheet" href="../../resources/css/collections.css">
    <link rel="stylesheet" href="../../resources/css/collections-report.css">
    <link rel="stylesheet" href="../../resources/css/print-report.css">
</head>
<body>

    <div class="app-container">
        <!-- 1. القائمة الجانبية المظلمة الاحترافية (Sidebar) -->
        <div id="sidebar-container"></div>

        <!-- مساحة العمل الرئيسية -->
        <main class="main-content">
            <!-- الشريط العلوي المستقر مع حسابات المستخدم واللغات -->
            <div id="navbar-container"></div>

            <div class="dashboard-container">

                <!-- حاوية صفحات الطباعة الاحترافية: مخفية تماماً على الشاشة،
                     تُبنى ديناميكياً وتظهر فقط عند استدعاء "طباعة" (انظر print-report.js/.css) -->
                <div id="printPagesRoot" class="print-report-container"></div>

                <div class="page-header">
                    <div class="header-title">
                        <h1 class="view-main-title">
                            <span class="title-icon">🧾</span>
                            <span data-i18n="menuCollectionsReport">تقرير تحصيل الموظفين</span>
                        </h1>
                        <p class="view-subtitle">تقرير تحصيل الرسوم الشهرية (صافي الراتب) لموظفي الإضافة عن شهر محدد</p>
                    </div>

                    <div class="header-actions report-actions-bar">
                        <!-- اختيار الشهر المطلوب عرض تقريره -->
                        <label for="collectionsReportMonthPicker" class="collections-report-month-label">
                            <span data-icon="calendar"></span>
                            <span>الشهر:</span>
                        </label>
                        <input type="month" id="collectionsReportMonthPicker" class="collections-report-month-input">

                        <button type="button" class="btn-export-excel" id="btnExportCollectionsReportExcel">📥 تصدير Excel</button>
                        <button type="button" class="btn-print-report" id="btnPrintCollectionsReport">🖨️ طباعة</button>
                    </div>
                </div>

                <!-- بطاقات الإحصائيات الأربع لنفس الشهر المختار والفلاتر الحالية -->
                <section class="collections-stats-grid">
                    <div class="collection-stat-card">
                        <div class="collection-stat-label">عدد موظفي الإضافة</div>
                        <div class="collection-stat-value" id="statReportEmployeeCount">0</div>
                    </div>
                    <div class="collection-stat-card">
                        <div class="collection-stat-label">إجمالي المستحق</div>
                        <div class="collection-stat-value" id="statReportTotalDue">0.00</div>
                    </div>
                    <div class="collection-stat-card collection-stat-paid">
                        <div class="collection-stat-label">المحصَّل</div>
                        <div class="collection-stat-value" id="statReportTotalPaid">0.00</div>
                    </div>
                    <div class="collection-stat-card collection-stat-unpaid">
                        <div class="collection-stat-label">المتبقي</div>
                        <div class="collection-stat-value" id="statReportTotalUnpaid">0.00</div>
                    </div>
                </section>

                <!-- شريط البحث والتصفية: قوائم بحث قابلة للكتابة فيها للموظف والشركة + فلتر الحالة -->
                <section class="companies-filter-bar report-filter-bar">
                    <div class="search-combo-wrapper" id="comboReportEmployeeSearch">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="collectionsReportEmployeeSearchInput" class="search-combo-input" placeholder="ابحث باسم الموظف..." autocomplete="off">
                        <div class="combo-dropdown" id="collectionsReportEmployeeDropdown"></div>
                    </div>
                    <div class="search-combo-wrapper" id="comboReportCompanySearch">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="collectionsReportCompanySearchInput" class="search-combo-input" placeholder="ابحث باسم الشركة..." autocomplete="off">
                        <div class="combo-dropdown" id="collectionsReportCompanyDropdown"></div>
                    </div>
                    <div class="filter-dropdown-wrapper">
                        <select id="collectionsReportStatusFilter">
                            <option value="all">الحالة: الكل</option>
                            <option value="paid">مدفوع</option>
                            <option value="unpaid">غير مدفوع</option>
                        </select>
                    </div>
                </section>

                <p class="report-results-count" id="collectionsReportResultsCount"></p>

                <!-- جدول تقرير تحصيل الموظفين
                     🆕 عمود "الموظف" يعرض اسم الموظف واسم الشركة تحته (سطر ثانوي رمادي)،
                     وعمود "رقم الهوية" يعرض رقم الهوية والمسمى الوظيفي تحته — بدل عمودين
                     منفصلين لكل منهما كما كان سابقاً، بنفس أسلوب شاشة "تحصيل الموظفين"
                     التشغيلية (انظر buildCollectionsReportRowHtml بملف collections-report.js).
                     ⚠️ تصدير Excel والطباعة يبقيان بعمودين منفصلين للشركة والمسمى الوظيفي
                     (بيانات جدولية مسطّحة، بلا تغيير). -->
                <section class="table-container">
                    <table class="companies-table">
                        <thead>
                            <tr>
                                <th>الموظف</th>
                                <th>رقم الهوية</th>
                                <th style="text-align: center;">المستحق</th>
                                <th style="text-align: center;">المستلم</th>
                                <th style="text-align: center;">المتبقي</th>
                                <th style="text-align: center;">الحالة</th>
                                <th style="text-align: center;">تاريخ التحصيل</th>
                            </tr>
                        </thead>
                        <tbody id="collectionsReportTableBody">
                            <tr>
                                <td colspan="7" class="table-loading-state">
                                    جاري جلب بيانات التقرير...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <!-- 📄 أزرار التنقل بين صفحات التقرير -->
                <div id="collectionsReportPagination" class="pagination-container"></div>
            </div>
        </main>
    </div>

    <!-- استدعاء ملفات تشغيل المنطق البرمجي والمحاكاة بالتوالي -->
    <script src="../../bootstrap/permissions.js?v=8"></script>
    <script src="../../bootstrap/app-core.js"></script>
    <script src="../shared/sidebar.js?v=3"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../scripts/collections-report.js?v=3"></script>
</body>
</html>
