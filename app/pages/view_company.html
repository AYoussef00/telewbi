<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات الشركة - بصمة الأعمال</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- استدعاء حزمة سوبابيس الرسمية عبر خادم unpkg المباشر والمستقر -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../routes/routes.js"></script>
    <script src="../shared/icons.js"></script>

    <link rel="stylesheet" href="../../resources/css/global-layout.css?v=2">
    <link rel="stylesheet" href="../../resources/css/sidebar.css?v=2">
    <link rel="stylesheet" href="../../resources/css/navbar.css">
    <!-- تنسيقات خاصة بشاشة عرض بيانات الشركة -->
    <link rel="stylesheet" href="../../resources/css/view_company.css">
</head>
<body>
    <div class="app-container">

        <div id="sidebar-container"></div>

        <main class="main-content">

            <div id="navbar-container"></div>

            <div class="page-container">
                <div class="view-company-container">

                    <div class="page-header">
                        <div class="header-title">
                            <nav class="breadcrumb-nav" aria-label="breadcrumb">
                                <span class="title-icon" data-icon="eye"></span>
                                <a href="companies.html" class="breadcrumb-link">الشركات</a>
                                <span class="breadcrumb-separator" aria-hidden="true">/</span>
                                <span class="breadcrumb-current">بيانات الشركة</span>
                            </nav>
                            <p class="view-subtitle">عرض بيانات الشركة ومستنداتها الرسمية (للعرض فقط)</p>
                        </div>
                    </div>

                    <div class="view-company-card">

                        <!-- شريط تنبيه لعرض رسائل الخطأ (مثل عدم العثور على الشركة) -->
                        <div id="viewAlert" class="form-alert" style="display:none;"></div>

                        <div id="viewCompanyContent" style="display:none;">

                            <div class="view-company-header">
                                <div class="view-company-avatar" id="companyAvatarInitial">؟</div>
                                <div class="view-company-heading">
                                    <h2 id="viewCompanyNameHeading">—</h2>
                                    <span class="plan-badge-none" id="viewCompanyPlanBadge">—</span>
                                </div>
                            </div>

                            <div class="view-fields-grid">

                                <div class="view-field full-width">
                                    <label>اسم الشركة</label>
                                    <div class="view-value" id="viewCompanyName">—</div>
                                </div>

                                <div class="view-field">
                                    <label>البريد الإلكتروني</label>
                                    <div class="view-value" id="viewCompanyEmail">—</div>
                                </div>

                                <div class="view-field">
                                    <label>رقم الجوال</label>
                                    <div class="view-value" id="viewCompanyPhone">—</div>
                                </div>

                                <div class="view-field">
                                    <label>رقم السجل التجاري</label>
                                    <div class="view-value" id="viewCompanyCR">—</div>
                                </div>

                                <div class="view-field">
                                    <label>الرقم الضريبي</label>
                                    <div class="view-value" id="viewCompanyTax">—</div>
                                </div>

                                <div class="view-field">
                                    <label>المدينة</label>
                                    <div class="view-value" id="viewCompanyCity">—</div>
                                </div>

                                <div class="view-field">
                                    <label>قطاع العمل</label>
                                    <div class="view-value" id="viewCompanySector">—</div>
                                </div>

                                <div class="view-field">
                                    <label>خطة الاشتراك</label>
                                    <div class="view-value" id="viewCompanyPlan">—</div>
                                </div>

                                <div class="view-field">
                                    <label>عدد الموظفين</label>
                                    <div class="view-value" id="viewCompanyEmployeeCount">—</div>
                                </div>

                                <div class="view-field">
                                    <label>الحالة</label>
                                    <div class="view-value" id="viewCompanyStatus">—</div>
                                </div>

                                <div class="view-field">
                                    <label>نوع العقد</label>
                                    <div class="view-value" id="viewCompanyContractType">—</div>
                                </div>

                                <div class="view-field">
                                    <label>تاريخ العقد</label>
                                    <div class="view-value" id="viewCompanyContractDate">—</div>
                                </div>

                                <div class="view-field">
                                    <label>قيمة الاشتراك</label>
                                    <div class="view-value" id="viewCompanySubscriptionValue">—</div>
                                </div>

                                <div class="view-field">
                                    <label>مسترد الشركة</label>
                                    <div class="view-value" id="viewCompanyRefund">0.00</div>
                                </div>

                                <div class="view-field">
                                    <label>رقم المنشأة</label>
                                    <div class="view-value" id="viewCompanyEstablishmentNumber">—</div>
                                </div>

                                <div class="view-field">
                                    <label>رقم هوية المنشأة</label>
                                    <div class="view-value" id="viewCompanyEstablishmentId">—</div>
                                </div>

                                <div class="view-field">
                                    <label>الشخص المفوض</label>
                                    <div class="view-value" id="viewCompanyAuthorizedPerson">—</div>
                                </div>

                                <div class="view-field">
                                    <label>رقم جوال الشخص المفوض</label>
                                    <div class="view-value" id="viewCompanyAuthorizedPersonPhone">—</div>
                                </div>

                                <!-- 🆕 اسم المندوب -->
                                <div class="view-field">
                                    <label>اسم المندوب</label>
                                    <div class="view-value" id="viewCompanyRepresentativeName">—</div>
                                </div>

                                <div class="view-field full-width">
                                    <label>العنوان الوطني بالكامل</label>
                                    <div class="view-value" id="viewCompanyAddress">—</div>
                                </div>

                                <!-- ملاحظة الحالة: تظهر فقط عند وجود ملاحظة على شركة "غير نشط" -->
                                <div class="view-field full-width" id="group-view-status_note" style="display:none;">
                                    <label>ملاحظة</label>
                                    <div class="view-value" id="viewCompanyStatusNote">—</div>
                                </div>

                            </div>

                            <h3 class="form-section-title"><span data-icon="paperclip" class="icon-inline"></span> المستندات الرسمية</h3>
                            <div class="view-docs-grid" id="viewCompanyDocsGrid">
                                <!-- تُبنى روابط/حالة المستندات ديناميكياً عبر view_company.js -->
                            </div>

                        </div>

                        <div class="view-company-actions">
                            <button type="button" id="btnBackToCompanies" class="btn btn-cancel">→ رجوع لقائمة الشركات</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../bootstrap/permissions.js?v=8"></script>
    <script src="../../bootstrap/app-core.js"></script>
    <script src="../shared/sidebar.js?v=3"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../scripts/view_company.js?v=4"></script>
</body>
</html>
