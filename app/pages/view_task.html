<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات المهمة - بصمة الأعمال</title>
    <!-- استدعاء خط Cairo للأنظمة العربية -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- استدعاء حزمة سوبابيس الرسمية عبر خادم unpkg المباشر والمستقر -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../routes/routes.js"></script>
    <script src="../shared/icons.js"></script>

    <!-- ملفات التنسيق الموديلار المفصولة والمنظمة -->
    <link rel="stylesheet" href="../../resources/css/global-layout.css?v=2">
    <link rel="stylesheet" href="../../resources/css/sidebar.css?v=2">
    <link rel="stylesheet" href="../../resources/css/navbar.css">
    <!-- إعادة استخدام نفس تنسيقات شاشة "إضافة موظف" (بطاقة/شبكة الحقول) وشاشة
         "إدارة المهام" (شارات النوع/الحالة) حتى تظهر شاشة العرض بنفس الطراز تماماً -->
    <link rel="stylesheet" href="../../resources/css/add_employee.css">
    <link rel="stylesheet" href="../../resources/css/view_employee.css">
    <link rel="stylesheet" href="../../resources/css/tasks.css">

    <!-- تنسيقات قسم "مستندات المهمة" (مضمَّنة هنا حتى لا تعتمد على ملف CSS مشترك) -->
    <style>
        .task-docs-section { margin-top: 28px; padding-top: 18px; border-top: 1px solid #e2e8f0; }
        .task-docs-upload-box { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; margin-bottom: 14px; }
        .task-docs-pick-btn { display: inline-flex; align-items: center; padding: 9px 16px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 600; color: #334155; cursor: pointer; }
        .task-docs-pick-btn:hover { background: #f1f5f9; }
        .task-docs-selected { font-size: 13px; color: #64748b; flex: 1; min-width: 120px; word-break: break-all; }
        .task-docs-hint { width: 100%; font-size: 12px; color: #94a3b8; }
        .task-docs-list { display: flex; flex-direction: column; gap: 8px; }
        .task-docs-empty { text-align: center; padding: 22px; color: #94a3b8; font-size: 13px; background: #f8fafc; border-radius: 8px; }
        .task-doc-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; }
        .task-doc-info { min-width: 0; }
        .task-doc-name { font-weight: 700; color: #1e293b; font-size: 14px; word-break: break-all; }
        .task-doc-meta { font-size: 12px; color: #94a3b8; margin-top: 3px; }
        .task-doc-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .btn-task-doc { padding: 6px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid; background: #fff; }
        .btn-task-doc-view { color: #c2410c; border-color: #fed7aa; background: #fff7ed; }
        .btn-task-doc-view:hover { background: #ffedd5; }
        .btn-task-doc-delete { color: #dc2626; border-color: #fecaca; }
        .btn-task-doc-delete:hover { background: #fef2f2; }
        @media (max-width: 600px) { .task-doc-row { flex-direction: column; align-items: stretch; } .task-doc-actions { justify-content: flex-end; } }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- اللوحة الجانبية للنظام -->
        <div id="sidebar-container"></div>

        <!-- منطقة المحتوى وشريط التنقل العلوي -->
        <main class="main-content">

            <div id="navbar-container"></div>

            <div class="page-container">
                <div class="add-employee-container">

                    <div class="page-header">
                        <div class="header-title">
                            <nav class="breadcrumb-nav" aria-label="breadcrumb">
                                <span class="title-icon">🗒️</span>
                                <span class="breadcrumb-current">بيانات المهمة</span>
                            </nav>
                            <p class="view-subtitle">عرض تفاصيل المهمة الكاملة ومستنداتها</p>
                        </div>
                    </div>

                    <!-- بطاقة عرض بيانات المهمة — للقراءة فقط -->
                    <div class="form-card">

                        <!-- شريط تنبيه عام لعرض رسائل الخطأ (مثل عدم العثور على المهمة أو عدم التصريح) -->
                        <div id="viewTaskAlert" class="form-alert" style="display:none;"></div>

                        <div id="viewTaskContent" style="display:none;">

                            <h3 class="form-section-title">📋 بيانات المهمة</h3>
                            <div class="form-grid">

                                <div class="form-group full-width" id="group-view-title">
                                    <label>عنوان المهمة</label>
                                    <div class="view-static-value" id="viewTaskTitle" style="font-weight:700; font-size:16px; color:#1e293b; padding:10px 0;">—</div>
                                </div>

                                <div class="form-group" id="group-view-type">
                                    <label>نوع المهمة</label>
                                    <div style="padding:6px 0;"><span class="badge-task-type" id="viewTaskTypeBadge">—</span></div>
                                </div>

                                <div class="form-group" id="group-view-status">
                                    <label>الحالة</label>
                                    <div style="padding:6px 0;"><span class="badge-task-status" id="viewTaskStatusBadge">—</span></div>
                                </div>

                                <div class="form-group" id="group-view-company">
                                    <label>الشركة</label>
                                    <input type="text" id="viewTaskCompany" disabled>
                                </div>

                                <div class="form-group" id="group-view-assignee">
                                    <label>الموظف المُسند إليه</label>
                                    <input type="text" id="viewTaskAssignee" disabled>
                                </div>

                                <div class="form-group" id="group-view-start_date">
                                    <label>تاريخ البداية</label>
                                    <input type="text" id="viewTaskStartDate" disabled>
                                </div>

                                <div class="form-group" id="group-view-due_date">
                                    <label>تاريخ الاستحقاق</label>
                                    <input type="text" id="viewTaskDueDate" disabled>
                                </div>

                                <div class="form-group" id="group-view-created_at">
                                    <label>تاريخ الإنشاء</label>
                                    <input type="text" id="viewTaskCreatedAt" disabled>
                                </div>

                                <div class="form-group full-width" id="group-view-notes">
                                    <label>الملاحظات</label>
                                    <div class="view-static-value" id="viewTaskNotes" style="white-space:pre-wrap; line-height:1.9; color:#334155; padding:10px 0;">—</div>
                                </div>

                            </div>

                            <!-- 📎 مستندات المهمة — يملؤه task_documents.js ولا يظهر إلا لمن له حق الوصول للمهمة -->
                            <div id="taskDocsSection" class="task-docs-section" style="display:none;">
                                <h3 class="form-section-title">📎 مستندات المهمة</h3>

                                <div id="taskDocsAlert" class="form-alert" style="display:none;"></div>

                                <div id="taskDocsUploadBox" class="task-docs-upload-box">
                                    <label for="taskDocsFileInput" class="task-docs-pick-btn">اختيار ملف</label>
                                    <input type="file" id="taskDocsFileInput" multiple style="display:none;"
                                           accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx,.xls,.xlsx">
                                    <span class="task-docs-selected" id="taskDocsSelectedLabel">لم يتم اختيار ملف</span>
                                    <button type="button" id="taskDocsUploadBtn" class="btn btn-submit">رفع المستند</button>
                                    <span class="task-docs-hint">الأنواع المسموحة: PDF، صور (JPG / PNG / WEBP)، Word، Excel — بحد أقصى 10 ميغابايت للملف.</span>
                                </div>

                                <div id="taskDocsList" class="task-docs-list">
                                    <div class="task-docs-empty">جاري تحميل المستندات...</div>
                                </div>
                            </div>
                        </div>

                        <!-- أزرار الإجراءات -->
                        <div class="form-actions">
                            <button type="button" id="btnBackFromTask" class="btn btn-cancel">→ رجوع</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- استدعاء ملفات تشغيل المنطق البرمجي والمحاكاة بالتوالي -->
    <script src="../../bootstrap/permissions.js?v=8"></script>
    <script src="../../bootstrap/app-core.js"></script>
    <script src="../shared/sidebar.js?v=3"></script>
    <script src="../shared/navbar.js"></script>
    <!-- ربط ملف العمليات الخارجي الخاص بشاشة عرض بيانات المهمة -->
    <script src="../scripts/view_task.js?v=2"></script>
    <!-- 📎 رفع وعرض مستندات المهمة -->
    <script src="../scripts/task_documents.js?v=1"></script>

</body>
</html>
