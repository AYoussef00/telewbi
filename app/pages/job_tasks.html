<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المهام - بصمة الأعمال</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../routes/routes.js"></script>
    <script src="../shared/icons.js"></script>

    <link rel="stylesheet" href="../../resources/css/global-layout.css?v=2">
    <link rel="stylesheet" href="../../resources/css/sidebar.css?v=2">
    <link rel="stylesheet" href="../../resources/css/navbar.css">
    <link rel="stylesheet" href="../../resources/css/add_employee.css">
    <link rel="stylesheet" href="../../resources/css/tasks.css">
    <link rel="stylesheet" href="../../resources/css/job_tasks.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="page-container">
                <div class="add-employee-container">

                    <div class="page-header">
                        <div class="header-title">
                            <nav class="breadcrumb-nav" aria-label="breadcrumb">
                                <span class="title-icon" data-icon="card-index"></span>
                                <a href="tasks.html" class="breadcrumb-link">إدارة المهام</a>
                                <span class="breadcrumb-separator" aria-hidden="true">/</span>
                                <span class="breadcrumb-current">قائمة المهام</span>
                            </nav>
                            <p class="view-subtitle">أضف مهاماً جاهزة لكل مسمى وظيفي — تُستخدم لاحقاً في التوليد التلقائي للمهام حسب الحضور من شاشة "إضافة مهام متعددة"</p>
                        </div>
                    </div>

                    <form id="jobTaskForm" class="form-card" novalidate>
                        <div id="formAlert" class="form-alert" style="display:none;"></div>

                        <div class="form-grid">
                            <div class="form-group full-width" id="group-job_title">
                                <label for="jobTaskJobTitleSearch">المسمى الوظيفي</label>
                                <div class="combo-box" id="comboJobTaskJobTitle">
                                    <input type="text" id="jobTaskJobTitleSearch" class="combo-input" placeholder="جاري تحميل المسميات الوظيفية..." autocomplete="off" disabled>
                                    <input type="hidden" id="jobTaskJobTitle">
                                    <span class="combo-arrow">▾</span>
                                    <div class="combo-dropdown" id="jobTaskJobTitleDropdown"></div>
                                </div>
                                <span class="field-error" id="error-job_title"></span>
                            </div>
                        </div>

                        <div class="form-group full-width" id="group-task_lines">
                            <label>مهام هذا المسمى الوظيفي</label>
                            <div id="taskLinesContainer" class="task-lines-container">
                                <div class="task-line-row">
                                    <input type="text" class="task-line-input" placeholder="مثال: مراجعة تقرير المبيعات اليومي">
                                    <button type="button" class="btn-remove-task-line" title="حذف السطر">×</button>
                                </div>
                            </div>
                            <button type="button" id="btnAddTaskLine" class="btn-add-task-line">+ إضافة سطر مهمة آخر</button>
                            <span class="field-error" id="error-task_lines"></span>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-submit" data-perm="add:tasks">حفظ المهام</button>
                            <button type="button" id="btnCancel" class="btn btn-cancel">إلغاء</button>
                        </div>
                    </form>

                    <section class="table-container job-tasks-table-section">
                        <div class="job-tasks-table-header">
                            <h3 class="form-section-title">📋 المهام المحفوظة حسب المسمى الوظيفي</h3>
                            <div class="filter-dropdown-wrapper">
                                <select id="jobTaskFilterSelect">
                                    <option value="all">كل المسميات الوظيفية</option>
                                </select>
                            </div>
                        </div>
                        <table class="companies-table job-tasks-grouped-table">
                            <thead>
                                <tr>
                                    <th style="width:66%;">نص المهمة</th>
                                    <th style="width:24%;">تاريخ الإضافة</th>
                                    <th style="width:10%; text-align:center;">حذف</th>
                                </tr>
                            </thead>
                            <tbody id="jobTasksTableBody">
                                <tr><td colspan="3" class="table-loading-state">جاري تحميل المهام...</td></tr>
                            </tbody>
                        </table>

                        <!-- 📄 أزرار التنقل بين صفحات الجدول (20 سطر لكل صفحة) -->
                        <div id="jobTasksPagination" class="pagination-container"></div>
                    </section>

                </div>
            </div>
        </main>
    </div>

    <script src="../../bootstrap/permissions.js?v=8"></script>
    <script src="../../bootstrap/app-core.js"></script>
    <script src="../shared/sidebar.js?v=3"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../scripts/job_tasks.js?v=2"></script>
</body>
</html>
