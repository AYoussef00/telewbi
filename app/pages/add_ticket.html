<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فتح تذكرة جديدة - بصمة الأعمال</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../routes/routes.js"></script>
    <script src="../shared/icons.js"></script>

    <link rel="stylesheet" href="../../resources/css/global-layout.css?v=2">
    <link rel="stylesheet" href="../../resources/css/sidebar.css?v=2">
    <link rel="stylesheet" href="../../resources/css/navbar.css">
    <link rel="stylesheet" href="../../resources/css/add_employee.css">
    <link rel="stylesheet" href="../../resources/css/tasks_bulk.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="page-container">
                <div class="add-employee-container">

                    <div class="page-header">
                        <div class="header-title">
                            <nav class="breadcrumb-nav" aria-label="breadcrumb">
                                <span class="title-icon" data-icon="headset"></span>
                                <a href="support.html" class="breadcrumb-link">الدعم الفني</a>
                                <span class="breadcrumb-separator" aria-hidden="true">/</span>
                                <span class="breadcrumb-current">فتح تذكرة جديدة</span>
                            </nav>
                            <p class="view-subtitle">صف مشكلتك أو استفسارك بالتفصيل، وسيتابعها فريق الدعم الفني في أقرب وقت</p>
                        </div>
                    </div>

                    <form id="addTicketForm" class="form-card" novalidate>
                        <div id="formAlert" class="form-alert" style="display:none;"></div>

                        <!-- الشركة (تُختار تلقائياً إن كانت واحدة لدى مسؤول الشركة، وتظهر اختيارية لمسؤولي النظام) -->
                        <div class="form-grid">
                            <div class="form-group full-width" id="group-company_id">
                                <label for="ticketCompanySearch">🏢 الشركة <span class="optional-tag" id="companyOptionalTag" style="display:none;">(اختياري)</span></label>
                                <div class="combo-box" id="comboTicketCompany">
                                    <input type="text" id="ticketCompanySearch" class="combo-input" placeholder="جاري تحميل الشركات..." autocomplete="off" disabled>
                                    <input type="hidden" id="ticketCompanyId">
                                    <span class="combo-arrow">▾</span>
                                    <div class="combo-dropdown" id="ticketCompanyDropdown"></div>
                                </div>
                                <span class="field-error" id="error-company_id"></span>
                            </div>
                        </div>

                        <!-- الموضوع -->
                        <div class="form-grid">
                            <div class="form-group full-width" id="group-subject">
                                <label for="ticketSubject">📝 موضوع التذكرة</label>
                                <input type="text" id="ticketSubject" placeholder="مثال: تعذّر إضافة سجل حضور لأحد الموظفين">
                                <span class="field-error" id="error-subject"></span>
                            </div>
                        </div>

                        <!-- وصف المشكلة -->
                        <div class="form-grid">
                            <div class="form-group full-width" id="group-description">
                                <label for="ticketDescription">🗒️ وصف المشكلة أو الاستفسار</label>
                                <textarea id="ticketDescription" class="bulk-task-notes" placeholder="اشرح المشكلة أو الاستفسار بالتفصيل حتى يتمكن فريق الدعم من مساعدتك بسرعة..."></textarea>
                                <span class="field-error" id="error-description"></span>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-submit" data-perm="add:support">إرسال التذكرة</button>
                            <button type="button" id="btnCancel" class="btn btn-cancel">إلغاء</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../../bootstrap/permissions.js?v=8"></script>
    <script src="../../bootstrap/app-core.js"></script>
    <script src="../shared/sidebar.js?v=3"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../scripts/add_ticket.js?v=2"></script>
</body>
</html>
