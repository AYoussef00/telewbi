<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل مسمى وظيفي - بصمة الأعمال</title>
    <!-- استدعاء خط Cairo للأنظمة العربية -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- استدعاء حزمة سوبابيس الرسمية عبر خادم unpkg المباشر والمستقر -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../routes/routes.js"></script>
    <script src="../shared/icons.js"></script>

    <!-- ملفات التنسيق الموديلار المفصولة والمنظمة (نفس تنسيق صفحة الإضافة) -->
    <link rel="stylesheet" href="../../resources/css/global-layout.css?v=2">
    <link rel="stylesheet" href="../../resources/css/sidebar.css?v=2">
    <link rel="stylesheet" href="../../resources/css/navbar.css">
    <link rel="stylesheet" href="../../resources/css/add_job.css">
</head>
<body>
    <div class="app-container">

        <!-- اللوحة الجانبية للنظام -->
        <div id="sidebar-container"></div>

        <!-- منطقة المحتوى وشريط التنقل العلوي -->
        <main class="main-content">

            <div id="navbar-container"></div>

            <div class="page-container">
                <div class="add-job-container">

                    <div class="page-header">
                        <div class="header-title">
                            <nav class="breadcrumb-nav" aria-label="breadcrumb">
                                <span class="title-icon">🏷️</span>
                                <a href="job-titles.html" class="breadcrumb-link" data-i18n="menuProfessions">المسميات الوظيفية</a>
                                <span class="breadcrumb-separator" aria-hidden="true">/</span>
                                <span class="breadcrumb-current" data-i18n="editJobTitle">تعديل المسمى الوظيفي</span>
                            </nav>
                            <p class="view-subtitle" data-i18n="editJobSubtitle">عدّل بيانات المسمى الوظيفي باللغتين العربية والإنجليزية</p>
                        </div>
                    </div>

                    <!-- نموذج تعديل بيانات المسمى الوظيفي (مطابق لجدول professions) -->
                    <form id="editJobForm" class="form-card" novalidate>

                        <!-- شريط تنبيه عام لعرض رسائل النجاح/الفشل بدل alert() -->
                        <div id="formAlert" class="form-alert" style="display:none;"></div>

                        <div class="form-grid">

                            <!-- حقل الاسم بالعربي -->
                            <div class="form-group" id="group-name_ar">
                                <label for="jobNameAr">المسمى الوظيفي بالعربي</label>
                                <input type="text" id="jobNameAr" name="name_ar" placeholder="مثال: مدير مبيعات">
                                <span class="field-error" id="error-name_ar"></span>
                            </div>

                            <!-- حقل الاسم بالإنجليزي: يقبل الكتابة بالعربي أيضاً، ويمكن ترجمته تلقائياً من الحقل العربي -->
                            <div class="form-group" id="group-name_en">
                                <label for="jobNameEn">
                                    المسمى الوظيفي بالإنجليزي
                                    <button type="button" id="btnAutoTranslate" class="btn-translate-inline" title="ترجمة المسمى العربي تلقائياً لهذا الحقل">🔄 ترجمة تلقائية</button>
                                </label>
                                <input type="text" id="jobNameEn" name="name_en" placeholder="Sales Manager — أو اكتبه بالعربي وسيُترجم تلقائياً" class="id-input">
                                <span class="field-error" id="error-name_en"></span>
                                <span class="field-hint" id="translateHint" style="display:none;"></span>
                            </div>

                        </div>

                        <!-- أزرار الإجراءات -->
                        <div class="form-actions">
                            <button type="submit" class="btn btn-submit" data-perm="edit:job_titles">حفظ التعديلات</button>
                            <button type="button" id="btnCancel" class="btn btn-cancel">إلغاء</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- استدعاء ملفات تشغيل المنطق البرمجي والمحاكاة بالتوالي -->
    <script src="../../bootstrap/permissions.js?v=8"></script>
    <script src="../../bootstrap/app-core.js"></script>
    <script src="../shared/sidebar.js?v=3"></script>
    <script src="../shared/navbar.js"></script>
    <!-- ربط ملف العمليات الخارجي -->
    <script src="../scripts/edit_job.js?v=2"></script>

</body>
</html>
