<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="attendanceTitle">بصمة الأعمال - إدارة الحضور والانصراف</title>

    <!-- خط القاهرة الرسمي المعتمد في واجهات المنصة -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- استدعاء حزمة سوبابيس الرسمية عبر خادم unpkg المباشر والمستقر -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../routes/routes.js"></script>
    <script src="../shared/icons.js"></script>

    <link rel="stylesheet" href="../../resources/css/global-layout.css?v=2">
    <link rel="stylesheet" href="../../resources/css/sidebar.css?v=2">
    <link rel="stylesheet" href="../../resources/css/navbar.css">
    <link rel="stylesheet" href="../../resources/css/employees.css">
    <link rel="stylesheet" href="../../resources/css/attendance.css">
</head>
<body>
    <div class="app-container">

        <!-- 1. القائمة الجانبية المظلمة الاحترافية (Sidebar) -->
        <div id="sidebar-container"></div>

        <!-- 2. مساحة المحتوى والبيانات الرئيسية (Main Workspace) -->
        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="dashboard-container">
                <div class="page-header">
                    <div class="header-title">
                        <h1 class="view-main-title">
                            <span class="title-icon" data-icon="clock"></span>
                            <span data-i18n="attendanceTitle">إدارة الحضور والانصراف</span>
                        </h1>
                        <p class="view-subtitle" data-i18n="attendanceSubtitle">إدارة وتتبع سجلات الحضور والانصراف لجميع الشركات والموظفين</p>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-primary" id="btnAddAttendance" data-perm="add:attendance" data-i18n="btnAddAttendance">+ إضافة سجل حضور</button>
                        <button class="btn-secondary" id="btnMultiRecords" data-perm="add:attendance" data-hide-for-company data-i18n="btnMultiRecords">إضافة سجلات متعددة</button>
                        <button class="btn-refresh" id="btnRefreshAttendance" title="تحديث"><span data-icon="refresh"></span></button>
                    </div>
                </div>

                <!-- بطاقات مؤشرات الحضور الأربعة -->
                <section class="counters-grid">
                    <div class="counter-card">
                        <div class="counter-label" data-i18n="totalRecords">إجمالي السجلات</div>
                        <div class="counter-value" id="totalRecordsCounter">0</div>
                    </div>
                    <div class="counter-card">
                        <div class="counter-label" data-i18n="totalAttendance">إجمالي الحضور</div>
                        <div class="counter-value" id="totalAttendanceCounter" style="color:#16a34a;">0</div>
                    </div>
                    <div class="counter-card">
                        <div class="counter-label" data-i18n="totalAbsence">إجمالي الغياب</div>
                        <div class="counter-value" id="totalAbsenceCounter" style="color:#ef4444;">0</div>
                    </div>
                    <div class="counter-card">
                        <div class="counter-label" data-i18n="totalDelay">إجمالي التأخير</div>
                        <div class="counter-value" id="totalDelayCounter" style="color:#f59e0b;">0</div>
                    </div>
                </section>

                <!-- فلاتر التصفية: بحث الموظف + الشركة (قائمة قابلة للاختيار) + نطاق التاريخ — بارتفاع وتنسيق موحّد لكل الحقول -->
                <section class="companies-filter-bar attendance-filter-bar">
                    <div class="search-box-wrapper">
                        <span class="search-icon" data-icon="search"></span>
                        <input type="text" id="employeeSearchInput" placeholder="بحث باسم الموظف..." data-i18n="searchPlaceholder">
                    </div>

                    <div class="combo-box att-company-combo" id="comboAttCompany">
                        <input type="text" id="attCompanySearch" class="combo-input" placeholder="جميع الشركات" autocomplete="off">
                        <input type="hidden" id="attCompanyId" value="">
                        <span class="combo-arrow">▾</span>
                        <div class="combo-dropdown" id="attCompanyDropdown"></div>
                    </div>

                    <div class="att-date-wrapper">
                        <input type="date" id="fromDateInput">
                        <span class="att-date-label" data-i18n="fromDate">من تاريخ</span>
                    </div>

                    <div class="att-date-wrapper">
                        <input type="date" id="toDateInput">
                        <span class="att-date-label" data-i18n="toDate">إلى تاريخ</span>
                    </div>
                </section>

                <!-- جدول البيانات الديناميكي لتسجيل الحضور والانصراف -->
                <section class="table-container">
                    <table class="companies-table">
                        <thead>
                            <tr>
                                <th style="width: 20%;" data-i18n="thEmployee">موظف</th>
                                <th style="width: 18%;" data-i18n="thCompany">الشركة</th>
                                <th style="width: 12%;" data-i18n="thDate">التاريخ</th>
                                <th style="width: 10%;" data-i18n="thCheckIn">دخول</th>
                                <th style="width: 10%;" data-i18n="thCheckOut">خروج</th>
                                <th style="width: 12%; text-align:center;" data-i18n="thStatus">الحالة</th>
                                <th style="width: 18%; text-align:center;" data-i18n="thActions">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody">
                            <tr>
                                <td colspan="7" class="table-loading-state">
                                    جاري تحميل سجلات الحضور...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <div id="attendancePagination" class="pagination-container"></div>
            </div>
        </main>
    </div>

    <script src="../../bootstrap/permissions.js?v=8"></script>
    <script src="../../bootstrap/app-core.js"></script>
    <script src="../shared/sidebar.js?v=3"></script>
    <script src="../shared/navbar.js"></script>
    <!-- 🔄 v=3: تحديث كسر ذاكرة التخزين المؤقت للمتصفح/السيرفر — أُضيف لاحقاً
         (بعد v=2) قيد "الأشهر المدفوعة فقط" لمسؤول الشركة (getPaidMonthsMapForCompanies
         بملف attendance.js) دون أن يُرفَق برقم إصدار جديد بحينها؛ أي متصفح كان
         قد حمّل attendance.js?v=2 سابقاً كان سيستمر بتقديم تلك النسخة المخبأة
         (بلا قيد الأشهر المدفوعة) رغم رفع محتوى الملف الجديد فعلياً على
         السيرفر — لأن عنوان الملف (URL) بنفس رقم الإصدار لم يتغيّر. -->
    <script src="../scripts/attendance.js?v=3"></script>
</body>
</html>
