<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="menuCompaniesCollectionsReport">تقرير تحصيل الشركات</title>

    <!-- خط القاهرة الرسمي المعتمد في واجهات المنصة -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- استدعاء حزمة سوبابيس الرسمية عبر خادم unpkg المباشر والمستقر -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="icons.js"></script>
    <!-- مكتبة SheetJS لتصدير التقرير كملف Excel (.xlsx) مباشرة من المتصفح -->
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- مكتبة توليد رمز QR (يُضمَّن بترويسة صفحة الطباعة، ويشير لصفحة عرض عامة للتقرير) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <!-- وحدة بناء صفحات الطباعة الاحترافية المشتركة (ترويسة/جدول/علامة مائية/تذييل) -->
    <script src="print-report.js?v=4"></script>

    <!-- ملفات التنسيق: نعيد استخدام تنسيقات شريط البحث/الجدول من employee-report.css
         وبطاقات الإحصائيات من collections.css، مع إضافات خاصة بهذا التقرير فقط
         بملف companies-collections-report.css -->
    <link rel="stylesheet" href="global-layout.css?v=2">
    <link rel="stylesheet" href="sidebar.css?v=2">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="companies.css">
    <link rel="stylesheet" href="employees.css">
    <link rel="stylesheet" href="employee-report.css">
    <link rel="stylesheet" href="collections.css">
    <link rel="stylesheet" href="companies-collections-report.css">
    <link rel="stylesheet" href="print-report.css">
</head>
<body>

    <div class="app-container">
        <!-- 1. القائمة الجانبية المظلمة الاحترافية (Sidebar) -->
        <div id="sidebar-container"></div>

        <!-- مساحة العمل الرئيسية -->
        <main class="main-content">
            <!-- الشريط العلوي المستقر مع حسابات المستخدم واللغات -->
            <div id="navbar-container"></div>

            <div class="dashboard-container">

                <!-- حاوية صفحات الطباعة الاحترافية: مخفية تماماً على الشاشة،
                     تُبنى ديناميكياً وتظهر فقط عند استدعاء "طباعة" (انظر print-report.js/.css) -->
                <div id="printPagesRoot" class="print-report-container"></div>

                <div class="page-header">
                    <div class="header-title">
                        <h1 class="view-main-title">
                            <span class="title-icon" data-icon="bank"></span>
                            <span data-i18n="menuCompaniesCollectionsReport">تقرير تحصيل الشركات</span>
                        </h1>
                        <p class="view-subtitle">إجمالي فواتير كل شركة، المحصَّل منها، والمتبقي، بحسب نطاق تاريخ الفواتير المحدد</p>
                    </div>

                    <div class="header-actions report-actions-bar">
                        <button type="button" class="btn-export-excel" id="btnExportCompanyCollectionsExcel"><span data-icon="download"></span> تصدير Excel</button>
                        <button type="button" class="btn-print-report" id="btnPrintCompanyCollectionsReport"><span data-icon="printer"></span> طباعة</button>
                    </div>
                </div>

                <!-- بطاقات الإحصائيات الأربع لكامل النتائج المطابقة للفلاتر الحالية -->
                <section class="collections-stats-grid">
                    <div class="collection-stat-card">
                        <div class="collection-stat-label">عدد الشركات</div>
                        <div class="collection-stat-value" id="statCompCollCount">0</div>
                    </div>
                    <div class="collection-stat-card">
                        <div class="collection-stat-label">إجمالي الفواتير</div>
                        <div class="collection-stat-value" id="statCompCollTotal">0.00</div>
                    </div>
                    <div class="collection-stat-card collection-stat-paid">
                        <div class="collection-stat-label">المحصَّل</div>
                        <div class="collection-stat-value" id="statCompCollPaid">0.00</div>
                    </div>
                    <div class="collection-stat-card collection-stat-unpaid">
                        <div class="collection-stat-label">المتبقي</div>
                        <div class="collection-stat-value" id="statCompCollRemaining">0.00</div>
                    </div>
                </section>

                <!-- شريط البحث والتصفية: بحث اسم الشركة + نطاق تاريخ الفواتير + فلتر حالة التحصيل -->
                <section class="companies-filter-bar report-filter-bar">
                    <div class="search-combo-wrapper" id="comboCompCollNameSearch">
                        <span class="search-icon" data-icon="search"></span>
                        <input type="text" id="compCollNameSearchInput" class="search-combo-input" placeholder="ابحث باسم الشركة..." autocomplete="off">
                        <div class="combo-dropdown" id="compCollNameDropdown"></div>
                    </div>
                    <div class="att-date-wrapper">
                        <input type="date" id="compCollFromDateInput">
                        <span class="att-date-label">من تاريخ</span>
                    </div>
                    <div class="att-date-wrapper">
                        <input type="date" id="compCollToDateInput">
                        <span class="att-date-label">إلى تاريخ</span>
                    </div>
                    <div class="filter-dropdown-wrapper">
                        <select id="compCollStatusFilter">
                            <option value="all">حالة التحصيل: الكل</option>
                            <option value="outstanding">لديها مبالغ متبقية</option>
                            <option value="fully_paid">محصَّلة بالكامل</option>
                        </select>
                    </div>
                </section>

                <p class="report-results-count" id="compCollResultsCount"></p>

                <!-- جدول تقرير تحصيل الشركات -->
                <section class="table-container">
                    <table class="companies-table">
                        <thead>
                            <tr>
                                <th style="width: 26%;">الشركة</th>
                                <th style="width: 12%; text-align: center;">عدد الفواتير</th>
                                <th style="width: 16%; text-align: center;">إجمالي الفواتير</th>
                                <th style="width: 14%; text-align: center;">المحصَّل</th>
                                <th style="width: 14%; text-align: center;">المتبقي</th>
                                <th style="width: 10%; text-align: center;">نسبة التحصيل</th>
                                <th style="width: 14%; text-align: center;">آخر فاتورة</th>
                            </tr>
                        </thead>
                        <tbody id="compCollTableBody">
                            <tr>
                                <td colspan="7" class="table-loading-state">
                                    جاري جلب بيانات التقرير...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <!-- 📄 أزرار التنقل بين صفحات التقرير -->
                <div id="compCollPagination" class="pagination-container"></div>
            </div>
        </main>
    </div>

    <!-- استدعاء ملفات تشغيل المنطق البرمجي والمحاكاة بالتوالي -->
    <script src="permissions.js?v=8"></script>
    <script src="app-core.js"></script>
    <script src="sidebar.js?v=3"></script>
    <script src="navbar.js"></script>
    <script src="companies-collections-report.js?v=3"></script>
</body>
</html>
