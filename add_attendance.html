<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة سجل حضور - بصمة الأعمال</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="icons.js"></script>

    <link rel="stylesheet" href="global-layout.css?v=2">
    <link rel="stylesheet" href="sidebar.css?v=2">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="add_employee.css">
    <link rel="stylesheet" href="add_attendance.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="page-container">
                <div class="add-employee-container">

                    <div class="page-header">
                        <div class="header-title">
                            <nav class="breadcrumb-nav" aria-label="breadcrumb">
                                <span class="title-icon" data-icon="clock"></span>
                                <a href="attendance.html" class="breadcrumb-link">إدارة الحضور والانصراف</a>
                                <span class="breadcrumb-separator" aria-hidden="true">/</span>
                                <span class="breadcrumb-current">إضافة سجل حضور</span>
                            </nav>
                            <p class="view-subtitle">أضف سجل حضور وانصراف جديد لأحد الموظفين</p>
                        </div>
                    </div>

                    <form id="addAttendanceForm" class="form-card" novalidate>
                        <div id="formAlert" class="form-alert" style="display:none;"></div>

                        <h3 class="form-section-title"><span class="section-title-icon" data-icon="clock"></span> بيانات سجل الحضور</h3>
                        <div class="form-grid">

                            <!-- الموظف (قائمة قابلة للبحث) -->
                            <div class="form-group full-width" id="group-employee_id">
                                <label for="attEmployeeSearch">الموظف</label>
                                <div class="combo-box" id="comboAttEmployee">
                                    <input type="text" id="attEmployeeSearch" class="combo-input" placeholder="جاري تحميل الموظفين..." autocomplete="off" disabled>
                                    <input type="hidden" id="attEmployeeId" name="employee_id">
                                    <span class="combo-arrow">▾</span>
                                    <div class="combo-dropdown" id="attEmployeeDropdown"></div>
                                </div>
                                <span class="field-error" id="error-employee_id"></span>
                            </div>

                            <!-- الشركة (تُعبّأ تلقائياً بعد اختيار الموظف) -->
                            <div class="form-group">
                                <label for="attCompanyDisplay">الشركة</label>
                                <input type="text" id="attCompanyDisplay" disabled placeholder="سيتم تحديدها تلقائياً">
                            </div>

                            <!-- التاريخ: يجب أن يكون بتاريخ ربط الموظف بالشركة أو بعده -->
                            <div class="form-group" id="group-date">
                                <label for="attDate">التاريخ</label>
                                <input type="date" id="attDate" name="date">
                                <span class="field-error" id="error-date"></span>
                                <span class="field-hint" id="hintAttDate"></span>
                            </div>

                            <!-- وقت الدخول -->
                            <div class="form-group" id="group-check_in">
                                <label for="attCheckIn">وقت الدخول</label>
                                <input type="time" id="attCheckIn" name="check_in">
                                <span class="field-error" id="error-check_in"></span>
                            </div>

                            <!-- وقت الخروج -->
                            <div class="form-group" id="group-check_out">
                                <label for="attCheckOut">وقت الخروج</label>
                                <input type="time" id="attCheckOut" name="check_out">
                                <span class="field-error" id="error-check_out"></span>
                            </div>

                            <!-- الحالة -->
                            <div class="form-group" id="group-status">
                                <label for="attStatus">الحالة</label>
                                <select id="attStatus" name="status">
                                    <option value="حاضر" selected>حاضر</option>
                                    <option value="غائب">غائب</option>
                                    <option value="متأخر">متأخر</option>
                                    <option value="إجازة سنوية">إجازة سنوية</option>
                                </select>
                                <span class="field-error" id="error-status"></span>
                            </div>

                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-submit" data-perm="add:attendance">حفظ سجل الحضور</button>
                            <button type="button" id="btnCancel" class="btn btn-cancel">إلغاء</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="permissions.js?v=8"></script>
    <script src="app-core.js"></script>
    <script src="sidebar.js?v=3"></script>
    <script src="navbar.js"></script>
    <script src="add_attendance.js?v=3"></script>
</body>
</html>
