<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض الفاتورة - بصمة الأعمال</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="icons.js"></script>

    <link rel="stylesheet" href="view_invoice.css">
</head>
<body>

    <!-- شريط أدوات علوي (لا يظهر عند الطباعة — انظر @media print بملف view_invoice.css) -->
    <div class="invoice-toolbar">
        <button type="button" class="btn-toolbar btn-toolbar-back" id="btnBackToInvoices">→ رجوع للفواتير</button>
        <div class="invoice-toolbar-actions">
            <button type="button" class="btn-toolbar btn-toolbar-paid" id="btnMarkPaid" data-perm="edit:finance_invoices" style="display:none;">✅ تعليم كمدفوعة</button>
            <button type="button" class="btn-toolbar btn-toolbar-print" id="btnPrintInvoice">🖨️ طباعة / حفظ PDF</button>
        </div>
    </div>

    <p id="invoiceLoadStatus" style="text-align:center; padding: 40px; font-family: 'Cairo', sans-serif; color:#64748b;">جاري تحميل بيانات الفاتورة...</p>

    <!-- تُبنى ورقة الفاتورة الكاملة ديناميكياً هنا عبر view_invoice.js -->
    <div id="invoiceSheetRoot"></div>

    <script src="permissions.js?v=8"></script>
    <script src="view_invoice.js?v=3"></script>
</body>
</html>
