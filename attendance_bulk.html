<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة سجلات حضور متعددة - بصمة الأعمال</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="icons.js"></script>

    <link rel="stylesheet" href="global-layout.css?v=2">
    <link rel="stylesheet" href="sidebar.css?v=2">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="add_employee.css">
    <link rel="stylesheet" href="add_attendance.css">
    <link rel="stylesheet" href="attendance_bulk.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="page-container">
                <div class="add-employee-container">

                    <div class="page-header">
                        <div class="header-title">
                            <nav class="breadcrumb-nav" aria-label="breadcrumb">
                                <span class="title-icon" data-icon="calendar"></span>
                                <a href="attendance.html" class="breadcrumb-link">إدارة الحضور والانصراف</a>
                                <span class="breadcrumb-separator" aria-hidden="true">/</span>
                                <span class="breadcrumb-current">إضافة سجلات حضور متعددة</span>
                            </nav>
                            <p class="view-subtitle">املأ التفاصيل أدناه لإضافة سجلات حضور لجميع موظفي الشركة المحددة، لأيام العمل ضمن النطاق المحدد وباستثناء أيام الإجازة الأسبوعية المختارة</p>
                        </div>
                    </div>

                    <form id="bulkAttendanceForm" class="form-card" novalidate>
                        <div id="formAlert" class="form-alert" style="display:none;"></div>

                        <!-- الشركة -->
                        <div class="form-grid">
                            <div class="form-group full-width" id="group-company_id">
                                <label for="bulkCompanySearch"><span class="inline-field-icon" data-icon="building"></span> الشركة</label>
                                <div class="combo-box" id="comboBulkCompany">
                                    <input type="text" id="bulkCompanySearch" class="combo-input" placeholder="ابحث عن شركة..." autocomplete="off" disabled>
                                    <input type="hidden" id="bulkCompanyId">
                                    <span class="combo-arrow">▾</span>
                                    <div class="combo-dropdown" id="bulkCompanyDropdown"></div>
                                </div>
                                <span class="field-error" id="error-company_id"></span>
                            </div>
                        </div>

                        <!-- نطاق التاريخ -->
                        <div class="form-grid">
                            <div class="form-group" id="group-from_date">
                                <label for="bulkFromDate"><span class="inline-field-icon" data-icon="calendar"></span> من تاريخ</label>
                                <input type="date" id="bulkFromDate">
                                <span class="field-error" id="error-from_date"></span>
                            </div>
                            <div class="form-group" id="group-to_date">
                                <label for="bulkToDate"><span class="inline-field-icon" data-icon="calendar"></span> إلى تاريخ</label>
                                <input type="date" id="bulkToDate">
                                <span class="field-error" id="error-to_date"></span>
                            </div>
                        </div>

                        <!-- أيام الإجازة الأسبوعية -->
                        <div class="form-grid">
                            <div class="form-group full-width" id="group-off_days">
                                <label><span class="inline-field-icon" data-icon="blocked"></span> أيام الإجازة الأسبوعية (لن يتم إنشاء سجلات حضور فيها)</label>
                                <div class="weekday-toggle-group" id="offDaysGroup">
                                    <label class="weekday-chip"><input type="checkbox" value="0"><span class="chip-box"></span><span class="chip-text">الأحد</span></label>
                                    <label class="weekday-chip"><input type="checkbox" value="1"><span class="chip-box"></span><span class="chip-text">الاثنين</span></label>
                                    <label class="weekday-chip"><input type="checkbox" value="2"><span class="chip-box"></span><span class="chip-text">الثلاثاء</span></label>
                                    <label class="weekday-chip"><input type="checkbox" value="3"><span class="chip-box"></span><span class="chip-text">الأربعاء</span></label>
                                    <label class="weekday-chip"><input type="checkbox" value="4"><span class="chip-box"></span><span class="chip-text">الخميس</span></label>
                                    <label class="weekday-chip"><input type="checkbox" value="5" checked><span class="chip-box"></span><span class="chip-text">الجمعة</span></label>
                                    <label class="weekday-chip"><input type="checkbox" value="6" checked><span class="chip-box"></span><span class="chip-text">السبت</span></label>
                                </div>
                                <span class="field-error" id="error-off_days"></span>
                            </div>
                        </div>

                        <!-- نطاق وقت الحضور -->
                        <h3 class="form-section-title range-section-title">نطاق وقت الحضور</h3>
                        <div class="form-grid">
                            <div class="form-group" id="group-checkin_from">
                                <label for="bulkCheckInFrom">من</label>
                                <input type="time" id="bulkCheckInFrom" value="08:00">
                                <span class="field-error" id="error-checkin_from"></span>
                            </div>
                            <div class="form-group" id="group-checkin_to">
                                <label for="bulkCheckInTo">إلى</label>
                                <input type="time" id="bulkCheckInTo" value="08:30">
                                <span class="field-error" id="error-checkin_to"></span>
                            </div>
                        </div>

                        <!-- نطاق وقت الانصراف -->
                        <h3 class="form-section-title range-section-title">نطاق وقت الانصراف</h3>
                        <div class="form-grid">
                            <div class="form-group" id="group-checkout_from">
                                <label for="bulkCheckOutFrom">من</label>
                                <input type="time" id="bulkCheckOutFrom" value="11:00">
                                <span class="field-error" id="error-checkout_from"></span>
                            </div>
                            <div class="form-group" id="group-checkout_to">
                                <label for="bulkCheckOutTo">إلى</label>
                                <input type="time" id="bulkCheckOutTo" value="13:00">
                                <span class="field-error" id="error-checkout_to"></span>
                            </div>
                        </div>

                        <!-- الحالة -->
                        <div class="form-grid">
                            <div class="form-group full-width" id="group-status">
                                <label for="bulkStatus">الحالة</label>
                                <select id="bulkStatus">
                                    <option value="حاضر" selected>حاضر</option>
                                    <option value="غائب">غائب</option>
                                    <option value="متأخر">متأخر</option>
                                    <option value="إجازة سنوية">إجازة سنوية</option>
                                </select>
                                <span class="field-error" id="error-status"></span>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-submit" data-perm="add:attendance">متابعة</button>
                            <button type="button" id="btnCancel" class="btn btn-cancel">إلغاء</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="permissions.js?v=8"></script>
    <script src="app-core.js"></script>
    <script src="sidebar.js?v=3"></script>
    <script src="navbar.js"></script>
    <script src="attendance_bulk.js?v=2"></script>
</body>
</html>
