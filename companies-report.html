<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="menuCompaniesReport">تقرير الشركات</title>

    <!-- خط القاهرة الرسمي المعتمد في واجهات المنصة -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- استدعاء حزمة سوبابيس الرسمية عبر خادم unpkg المباشر والمستقر -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="icons.js"></script>
    <!-- مكتبة SheetJS لتصدير التقرير كملف Excel (.xlsx) مباشرة من المتصفح -->
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- مكتبة توليد رمز QR (يُضمَّن بترويسة صفحة الطباعة، ويشير لصفحة عرض عامة للتقرير) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <!-- وحدة بناء صفحات الطباعة الاحترافية المشتركة (ترويسة/جدول/علامة مائية/تذييل) -->
    <script src="print-report.js?v=4"></script>

    <!-- ملفات التنسيق الموديلار المفصولة والمنظمة (نفس أساس تقرير الموظفين لتطابق بصري بين صفحات التقارير) -->
    <link rel="stylesheet" href="global-layout.css?v=2">
    <link rel="stylesheet" href="sidebar.css?v=2">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="employees.css">
    <link rel="stylesheet" href="companies-report.css">
    <link rel="stylesheet" href="print-report.css">
</head>
<body>

    <div class="app-container">
        <!-- 1. القائمة الجانبية المظلمة الاحترافية (Sidebar) -->
        <div id="sidebar-container"></div>

        <!-- مساحة العمل الرئيسية -->
        <main class="main-content">
            <!-- الشريط العلوي المستقر مع حسابات المستخدم واللغات -->
            <div id="navbar-container"></div>

            <div class="dashboard-container">

                <!-- حاوية صفحات الطباعة الاحترافية: مخفية تماماً على الشاشة،
                     تُبنى ديناميكياً وتظهر فقط عند استدعاء "طباعة" (انظر print-report.js/.css) -->
                <div id="printPagesRoot" class="print-report-container"></div>

                <div class="page-header">
                    <div class="header-title">
                        <h1 class="view-main-title">
                            <span class="title-icon" data-icon="building"></span>
                            <span data-i18n="menuCompaniesReport">تقرير الشركات</span>
                        </h1>
                        <p class="view-subtitle">بحث شامل في بيانات الشركات وتصدير التقرير</p>
                    </div>

                    <div class="header-actions report-actions-bar">
                        <button type="button" class="btn-export-excel" id="btnExportExcel"><span data-icon="download"></span> تصدير Excel</button>
                        <button type="button" class="btn-print-report" id="btnPrintReport"><span data-icon="printer"></span> طباعة</button>
                    </div>
                </div>

                <!-- شريط البحث والتصفية: قوائم بحث قابلة للكتابة فيها (Searchable Combobox) للشركة والمدينة + نطاق تاريخ العقد + فلتر الحالة -->
                <section class="companies-filter-bar report-filter-bar">
                    <div class="search-combo-wrapper" id="comboCompanyNameSearch">
                        <span class="search-icon" data-icon="search"></span>
                        <input type="text" id="reportCompanyNameSearchInput" class="search-combo-input" placeholder="ابحث باسم الشركة..." autocomplete="off">
                        <div class="combo-dropdown" id="reportCompanyNameDropdown"></div>
                    </div>
                    <div class="search-combo-wrapper" id="comboCitySearch">
                        <span class="search-icon" data-icon="search"></span>
                        <input type="text" id="reportCitySearchInput" class="search-combo-input" placeholder="ابحث بالمدينة..." autocomplete="off">
                        <div class="combo-dropdown" id="reportCityDropdown"></div>
                    </div>
                    <div class="att-date-wrapper">
                        <input type="date" id="reportFromDateInput">
                        <span class="att-date-label">من تاريخ</span>
                    </div>
                    <div class="att-date-wrapper">
                        <input type="date" id="reportToDateInput">
                        <span class="att-date-label">إلى تاريخ</span>
                    </div>
                    <div class="filter-dropdown-wrapper">
                        <select id="reportStatusFilter">
                            <option value="all">الحالة (الكل)</option>
                            <option value="active">نشط</option>
                            <option value="inactive">غير نشط</option>
                        </select>
                    </div>
                </section>

                <p class="report-results-count" id="reportResultsCount"></p>

                <!-- جدول تقرير الشركات
                     🆕 عمود "اسم الشركة" يعرض الآن البريد الإلكتروني تحته (سطر ثانوي
                     رمادي)، بدل عمود "البريد الإلكتروني" المنفصل السابق — انظر
                     buildCompanyReportRowHtml بملف companies-report.js. تصدير Excel
                     يبقى بعمودين منفصلين (بيانات جدولية مسطّحة بلا تغيير). -->
                <section class="table-container">
                    <table class="companies-table">
                        <thead>
                            <tr>
                                <th style="width: 26%;">اسم الشركة</th>
                                <th style="width: 14%;">رقم الهاتف</th>
                                <th style="width: 14%;">المدينة</th>
                                <th style="width: 15%; text-align: center;">تاريخ العقد</th>
                                <th style="width: 10%; text-align: center;">عدد الإضافة</th>
                                <th style="width: 10%; text-align: center;">عدد الاستضافة</th>
                                <th style="width: 11%; text-align: center;">عدد الموظفين</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody">
                            <tr>
                                <td colspan="7" class="table-loading-state">
                                    جاري جلب بيانات التقرير...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <!-- 📄 أزرار التنقل بين صفحات التقرير -->
                <div id="reportPagination" class="pagination-container"></div>
            </div>
        </main>
    </div>

    <!-- استدعاء ملفات تشغيل المنطق البرمجي والمحاكاة بالتوالي -->
    <script src="permissions.js?v=8"></script>
    <script src="app-core.js"></script>
    <script src="sidebar.js?v=3"></script>
    <script src="navbar.js"></script>
    <script src="companies-report.js?v=5"></script>
</body>
</html>
