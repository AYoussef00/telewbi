<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير كلمة المرور - بصمة الأعمال</title>
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="change-password.css">
</head>
<body>

    <div class="cp-screen">
        <div class="cp-card">
            <div class="cp-logo-section">
                <img src="logo.png" alt="شعار شركة بصمة الأعمال" class="cp-logo">
                <h1 class="cp-title">🔒 يجب تغيير كلمة المرور</h1>
                <p class="cp-subtitle">هذا حساب جديد بكلمة مرور مؤقتة. الرجاء تعيين كلمة مرور خاصة بك قبل المتابعة إلى النظام.</p>
            </div>

            <div id="cpAlert" class="form-alert" style="display:none;"></div>

            <form id="changePasswordForm" novalidate>
                <div class="form-group" id="group-new_password">
                    <label for="newPassword">كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" placeholder="8 أحرف على الأقل">
                    <span class="field-error" id="error-new_password"></span>
                </div>

                <div class="form-group" id="group-confirm_password">
                    <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
                    <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور">
                    <span class="field-error" id="error-confirm_password"></span>
                </div>

                <button type="submit" class="btn-cp-submit">
                    <span class="cp-spinner" id="cpSpinner" style="display:none;"></span>
                    <span id="cpBtnText">تحديث كلمة المرور والمتابعة</span>
                </button>
            </form>

            <button type="button" class="cp-logout-link" id="btnCpLogout">تسجيل الخروج بدلاً من ذلك</button>
        </div>
    </div>

    <script src="change-password.js"></script>
</body>
</html>
