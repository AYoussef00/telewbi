<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="menuEmployeeLinks">بصمة الأعمال - ربط الموظفين</title>

    <!-- خط القاهرة الرسمي المعتمد في واجهات المنصة -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- استدعاء حزمة سوبابيس الرسمية عبر خادم unpkg المباشر والمستقر -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="icons.js"></script>

    <!-- إعادة استخدام نفس تنسيقات شاشة "الموظفين" حتى تظهر هذه الشاشة بنفس الطراز تماماً -->
    <link rel="stylesheet" href="global-layout.css?v=2">
    <link rel="stylesheet" href="sidebar.css?v=2">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="employees.css?v=3">
</head>
<body>

    <div class="app-container">
        <!-- 1. القائمة الجانبية المظلمة الاحترافية (Sidebar) -->
        <div id="sidebar-container"></div>

        <!-- مساحة العمل الرئيسية -->
        <main class="main-content">
            <!-- الشريط العلوي المستقر مع حسابات المستخدم واللغات -->
            <div id="navbar-container"></div>

            <div class="dashboard-container">
                <div class="page-header">
                    <div class="header-title">
                        <h1 class="view-main-title">
                            <span class="title-icon" data-icon="link"></span>
                            <span data-i18n="menuEmployeeLinks">ربط الموظفين</span>
                        </h1>
                        <p class="view-subtitle" data-i18n="employeeLinksListSubtitle">قائمة الموظفين الذين تم ربطهم بالشركات</p>
                    </div>

                    <div class="header-actions">
                        <button class="btn-add-employee" id="btnAddEmployeeLink" data-perm="add:employee_links" data-i18n="btnAddEmployeeLink">+ ربط موظف جديد</button>
                    </div>
                </div>

                <!-- شريط التصفية: قوائم قابلة للبحث (اكتب لتصفية الاقتراحات) لاسم الموظف،
                     رقم الهوية، والشركة، بالإضافة لقائمة نوع الربط -->
                <section class="companies-filter-bar">
                    <div class="search-box-wrapper">
                        <span class="search-icon" data-icon="search"></span>
                        <input type="text" id="linkEmployeeNameSearch" autocomplete="off" placeholder="بحث باسم الموظف...">
                        <div class="combo-dropdown" id="linkEmployeeNameDropdown"></div>
                    </div>
                    <div class="search-box-wrapper">
                        <span class="search-icon" data-icon="search"></span>
                        <input type="text" id="linkNationalIdSearch" autocomplete="off" placeholder="بحث برقم الهوية...">
                        <div class="combo-dropdown" id="linkNationalIdDropdown"></div>
                    </div>
                    <div class="search-box-wrapper">
                        <span class="search-icon" data-icon="search"></span>
                        <input type="text" id="linkCompanySearch" autocomplete="off" placeholder="بحث باسم الشركة...">
                        <div class="combo-dropdown" id="linkCompanyDropdown"></div>
                    </div>
                    <div class="filter-dropdown-wrapper">
                        <select id="linkTypeFilter">
                            <option value="all">نوع الربط (الكل)</option>
                            <option value="اضافة">اضافة</option>
                            <option value="استضافة">استضافة</option>
                        </select>
                    </div>
                </section>

                <!-- جدول عرض الموظفين المرتبطين بالشركات
                     🆕 عمود "الموظف" يعرض اسم الموظف واسم الشركة تحته (سطر ثانوي رمادي)،
                     بدل عمود "الشركة" المنفصل السابق، وعمود "تاريخ الربط" يعرض تاريخ
                     الانتهاء تحته (سطر ثانوي)، بدل عمود "تاريخ الانتهاء" المنفصل —
                     انظر renderEmployeeLinksTable بملف employee_links.js. -->
                <section class="table-container">
                    <table class="companies-table">
                        <thead>
                            <tr>
                                <th style="width: 16%;" data-i18n="thLinkEmployee">الموظف</th>
                                <th style="width: 12%;" data-i18n="thLinkJobTitle">المسمى الوظيفي</th>
                                <th style="width: 8%; text-align: center;" data-i18n="thLinkType">نوع الربط</th>
                                <th style="width: 10%; text-align: center;">حالة الربط</th>
                                <th style="width: 16%; text-align: center;" data-i18n="thLinkDate">تاريخ الربط</th>
                                <th style="width: 10%; text-align: center;" data-i18n="thLinkSubscription">قيمة الاشتراك</th>
                                <th style="width: 9%; text-align: center;" data-i18n="thLinkSalary">الصافي</th>
                                <th style="width: 8%; text-align: center;" data-i18n="thEmpActions">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="employeeLinksTableBody">
                            <tr>
                                <td colspan="8" class="table-loading-state">
                                    جاري جلب قائمة الموظفين المرتبطين...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <!-- 📄 أزرار التنقل بين الصفحات -->
                <div id="employeeLinksPagination" class="pagination-container"></div>
            </div>
        </main>
    </div>

    <!-- استدعاء ملفات تشغيل المنطق البرمجي والمحاكاة بالتوالي -->
    <script src="permissions.js?v=8"></script>
    <script src="app-core.js"></script>
    <script src="sidebar.js?v=3"></script>
    <script src="navbar.js"></script>
    <script src="employee_links.js?v=6"></script>
</body>
</html>
